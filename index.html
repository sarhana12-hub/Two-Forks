<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Forks</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF8F2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  color-scheme: light dark;
  --bg: #FBF8F2;
  --surface: #FFFFFF;
  --surface-2: #F1EAD9;
  --ink: #241F1B;
  --ink-soft: #6B6259;
  --ink-faint: #A79E90;
  --accent: #1F6F5C;
  --accent-strong: #164F41;
  --accent-ink: #FFFFFF;
  --gold: #B9862C;
  --gold-soft: #F3E3BE;
  --chili: #B23A26;
  --chili-soft: #F6DED7;
  --border: #E7DFCF;
  --shadow: 0 8px 24px rgba(36,31,27,0.08);
  --shadow-lift: 0 14px 32px rgba(36,31,27,0.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #16130F; --surface: #201B15; --surface-2: #28221A; --ink: #F3EDE2; --ink-soft: #B7AC9C; --ink-faint: #776E60;
    --accent: #4FBFA0; --accent-strong: #6ED4B7; --accent-ink: #0E1512; --gold: #E8BB63; --gold-soft: #3A2F1B;
    --chili: #E2705C; --chili-soft: #3A211B; --border: #362F24;
    --shadow: 0 8px 24px rgba(0,0,0,0.35); --shadow-lift: 0 14px 36px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg: #16130F; --surface: #201B15; --surface-2: #28221A; --ink: #F3EDE2; --ink-soft: #B7AC9C; --ink-faint: #776E60;
  --accent: #4FBFA0; --accent-strong: #6ED4B7; --accent-ink: #0E1512; --gold: #E8BB63; --gold-soft: #3A2F1B;
  --chili: #E2705C; --chili-soft: #3A211B; --border: #362F24;
  --shadow: 0 8px 24px rgba(0,0,0,0.35); --shadow-lift: 0 14px 36px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: 'Work Sans', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
img{ max-width:100%; }
[hidden]{ display:none!important; }
#app{ min-height:100vh; display:flex; justify-content:center; }
.shell{
  width:100%; max-width:480px; min-height:100vh;
  background:var(--bg);
  display:flex; flex-direction:column;
  position:relative;
  box-shadow: var(--shadow);
}
@media (min-width:520px){
  body{ background:
    radial-gradient(1200px 800px at 15% -10%, var(--surface-2), transparent 60%),
    var(--bg); }
  .shell{ margin-block:24px; border-radius:20px; overflow:hidden; min-height:calc(100vh - 48px); }
}

h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; }
.mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
a{ color:var(--accent); }

/* ---------- Onboarding / Auth ---------- */
.onboard{ flex:1; display:flex; flex-direction:column; padding:28px 24px calc(28px + env(safe-area-inset-bottom)); }
.onboard-hero{ margin-top:8vh; margin-bottom:32px; }
.onboard-hero .fork{ font-size:40px; line-height:1; margin-bottom:14px; }
.onboard-hero h1{ font-size:36px; font-weight:600; margin:0 0 10px; color:var(--ink); }
.onboard-hero p{ color:var(--ink-soft); font-size:15.5px; line-height:1.5; margin:0; max-width:34ch; }
.onboard-actions{ display:flex; flex-direction:column; gap:12px; margin-top:auto; }
.card-panel{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
input[type=text], input[type=date], input[type=search], input[type=email], input[type=password], select, textarea{
  font:inherit; font-size:16px; padding:11px 13px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink); width:100%;
}
input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
textarea{ resize:vertical; min-height:70px; font-family:inherit; }

.btn{ font:inherit; font-size:15.5px; font-weight:600; border-radius:12px; border:1px solid transparent;
  padding:13px 18px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:active{ background:var(--accent-strong); }
.btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--border); }
.btn-ghost{ background:transparent; color:var(--accent); border-color:transparent; padding:8px 4px; }
.btn-danger{ background:transparent; color:var(--chili); border:1px solid var(--chili-soft); }
.btn-block{ width:100%; }
.btn:disabled{ opacity:.5; cursor:default; }
.btn-sm{ padding:8px 12px; font-size:13.5px; border-radius:9px; }

.link-row{ text-align:center; margin-top:6px; }
.link-btn{ background:none; border:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; font-size:14.5px; }

.back-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.icon-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex:none; }

.divider{ display:flex; align-items:center; gap:12px; color:var(--ink-faint); font-size:12.5px; margin:16px 0; }
.divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--border); }

.error-text{ color:var(--chili); font-size:13px; margin:-6px 0 12px; line-height:1.4; }
.err-box{ background:var(--chili-soft); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }

/* ---------- App shell ---------- */
.header{ position:sticky; top:0; z-index:5; background:var(--bg); padding:16px 18px 10px; display:flex; flex-direction:column; gap:12px; }
.header-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand{ display:flex; align-items:center; gap:8px; }
.brand .fork{ font-size:20px; }
.brand span{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; }
.people-row{ display:flex; align-items:center; }
.avatar{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff; border:2px solid var(--bg); margin-left:-8px; }
.avatar:first-child{ margin-left:0; }
.sync-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
.sync-note{ font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; }

.search-wrap{ position:relative; }
.search-wrap input{ padding-left:36px; background:var(--surface-2); border-color:transparent; }
.search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.55; }

.tabs-title{ font-size:26px; font-weight:600; margin:0; }

.chip-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 18px 4px; margin:0 -18px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }
.chip{ flex:none; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
  font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
.chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

.content{ flex:1; padding:14px 18px calc(96px + env(safe-area-inset-bottom)); overflow-y:auto; }

.section-heading{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
  margin:20px 0 10px; }
.section-heading:first-child{ margin-top:4px; }

.empty{ text-align:center; padding:48px 20px; color:var(--ink-soft); }
.empty .fork{ font-size:34px; display:block; margin-bottom:10px; }
.empty p{ margin:0 0 16px; font-size:14.5px; line-height:1.5; }

.place-card{ display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px; margin-bottom:10px; cursor:pointer; align-items:flex-start; }
.place-card:active{ background:var(--surface-2); }
.place-thumb{ width:60px; height:60px; border-radius:10px; background:var(--surface-2); flex:none; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:22px; }
.place-thumb img{ width:100%; height:100%; object-fit:cover; }
.place-main{ flex:1; min-width:0; }
.place-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.place-name{ font-weight:600; font-size:15.5px; }
.price-tag{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--gold); font-weight:600; flex:none; }
.place-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.dot-sep::before{ content:"·"; margin-right:6px; color:var(--ink-faint); }
.stars{ display:inline-flex; gap:1px; }
.stars svg{ width:13px; height:13px; }
.rating-line{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12.5px; color:var(--ink-soft); }
.rating-line b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }
.per-person{ font-size:11.5px; color:var(--ink-faint); }
.tag-row{ margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; }
.tag-pill{ font-size:11px; background:var(--surface-2); color:var(--ink-soft); padding:2px 8px; border-radius:999px; }

.category-group{ margin-bottom:6px; }
.category-title{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:600; font-size:15px;
  margin:18px 0 8px; color:var(--ink); }
.category-title .count{ color:var(--ink-faint); font-weight:500; font-size:13px; }

.want-actions{ display:flex; gap:8px; margin-top:8px; }

.tabbar{ position:sticky; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
.tabbar button{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-faint); font:inherit; font-size:10.5px; font-weight:600; padding:6px 2px; cursor:pointer; }
.tabbar button.active{ color:var(--accent); }
.tabbar svg{ width:22px; height:22px; }

.fab{ position:fixed; z-index:7; right:calc(50% - 240px + 20px); bottom:calc(74px + env(safe-area-inset-bottom));
  width:54px; height:54px; border-radius:50%; background:var(--accent); color:var(--accent-ink); border:none;
  box-shadow:var(--shadow-lift); display:flex; align-items:center; justify-content:center; cursor:pointer; }
@media (max-width:519px){ .fab{ right:20px; } }
.fab svg{ width:24px; height:24px; }

.overlay{ position:fixed; inset:0; background:rgba(20,16,10,0.45); z-index:20; display:flex; justify-content:center; }
.sheet{ width:100%; max-width:480px; margin-top:auto; background:var(--bg); border-radius:20px 20px 0 0;
  max-height:92vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lift); }
@media (min-width:520px){ .overlay{ align-items:center; } .sheet{ margin-top:0; border-radius:18px; max-height:88vh; } }
.sheet-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); flex:none; }
.sheet-header h2{ font-size:18px; margin:0; font-weight:600; }
.sheet-body{ padding:16px 18px 8px; overflow-y:auto; flex:1; }
.sheet-footer{ padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); display:flex; gap:10px; flex:none; }

.segment{ display:flex; border:1px solid var(--border); border-radius:11px; overflow:hidden; }
.segment button{ flex:1; padding:10px; font:inherit; font-size:14px; font-weight:600; border:none; background:var(--surface); color:var(--ink-soft); cursor:pointer; }
.segment button.active{ background:var(--accent); color:var(--accent-ink); }
.segment button + button{ border-left:1px solid var(--border); }

.price-select{ display:flex; gap:8px; }
.price-select button{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink-soft); cursor:pointer; }
.price-select button.active{ background:var(--gold-soft); color:var(--gold); border-color:var(--gold); }

.cat-row{ display:flex; gap:8px; }
.cat-row select{ flex:1; }

.star-input{ display:flex; gap:4px; }
.star-input button{ background:none; border:none; padding:2px; cursor:pointer; }
.star-input svg{ width:30px; height:30px; }

.tag-input-row{ display:flex; gap:8px; }
.tag-input-row input{ flex:1; }
.chips-edit{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip-edit{ display:flex; align-items:center; gap:6px; background:var(--surface-2); padding:5px 6px 5px 12px; border-radius:999px; font-size:13px; }
.chip-edit button{ background:none; border:none; cursor:pointer; color:var(--ink-faint); display:flex; padding:2px; }

.photo-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.photo-thumb{ width:72px; height:72px; border-radius:10px; overflow:hidden; position:relative; background:var(--surface-2); }
.photo-thumb img{ width:100%; height:100%; object-fit:cover; }
.photo-thumb button{ position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:rgba(20,16,10,.65);
  color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.photo-add{ width:72px; height:72px; border-radius:10px; border:1.5px dashed var(--border); background:none; color:var(--ink-faint);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; cursor:pointer; }

.others-ratings{ background:var(--surface-2); border-radius:12px; padding:12px 14px; margin-top:4px; }
.others-ratings .row{ display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0; }

.confirm-box{ background:var(--chili-soft); border:1px solid var(--chili); border-radius:12px; padding:14px; margin-top:12px; }
.confirm-box p{ margin:0 0 10px; font-size:13.5px; color:var(--ink); }
.confirm-box .row{ display:flex; gap:8px; }

.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); gap:12px; }
.settings-row:last-child{ border-bottom:none; }
.settings-row .label{ font-size:14.5px; font-weight:600; }
.settings-row .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

.code-display{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border-radius:12px;
  padding:14px 16px; }
.code-display .code{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; letter-spacing:.04em; }

.cat-manage-row{ display:flex; align-items:center; gap:8px; padding:8px 0; }
.cat-manage-row input{ flex:1; }
.cat-manage-row .icon-btn{ width:32px; height:32px; }

.shuffle-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:8px; }
.shuffle-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:26px 22px; width:100%; margin-top:18px; }
.shuffle-card .fork{ font-size:30px; }
.shuffle-card h3{ font-size:22px; margin:10px 0 4px; }
.shuffle-card .cat{ color:var(--ink-soft); font-size:13.5px; margin-bottom:12px; }

.toast{ position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
  z-index:30; box-shadow:var(--shadow-lift); max-width:88%; text-align:center; }

.helper-text{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 14px; }
.center-loading{ margin-top:30vh; text-align:center; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
  GoogleAuthProvider, signInWithPopup,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  sendPasswordResetEmail, signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, onSnapshot, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxY-rwhNvTsREJ7IvM33I0PTNNk8gxWJw",
  authDomain: "two-forks-32e3d.firebaseapp.com",
  projectId: "two-forks-32e3d",
  storageBucket: "two-forks-32e3d.firebasestorage.app",
  messagingSenderId: "514216300410",
  appId: "1:514216300410:web:88aa6bfa4951e67e6f90c3"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const dbase = getFirestore(fbApp);
setPersistence(auth, browserLocalPersistence).catch(function(){});
try{ enableIndexedDbPersistence(dbase).catch(function(){}); }catch(e){}

var FOOD_WORDS = ["TACO","PLUM","MISO","LIME","SAGE","KALE","CORN","OKRA","BEAN","RICE","MINT","PEAR","FIGS","NUTS","EGGS","SOUP","STEW","CAKE","TART","BUNS","ROLL","CHAI","BREW","SALT","CRAB","CLAM","TUNA","DUCK","LAMB","PORK","SUSH","DILL","LEEK","YAMS","OATS","CURR","COCO","BASI","NAAN","PHOS"];
var CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
var DEFAULT_CATEGORIES = ["Tacos","Pizza","Coffee","Brunch","Burgers","Ramen","Ice Cream","Bars & Drinks"];
var AVATAR_COLORS = ["#1F6F5C","#B23A26","#B9862C","#4A6FA5","#8654A3","#3E8E7E","#C1583F","#5C7A2E"];
var MAX_PHOTOS = 3;

function genCode(){
  var w = FOOD_WORDS[Math.floor(Math.random()*FOOD_WORDS.length)];
  var suffix = "";
  for(var i=0;i<3;i++) suffix += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return w + "-" + suffix;
}
function normCode(s){ return (s||"").trim().toUpperCase().replace(/[^A-Z0-9-]/g,""); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function avatarColor(name){ var h=0; name=name||"?"; for(var i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i))>>>0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function initials(name){ name=(name||"?").trim(); if(!name) return "?"; var parts=name.split(/\s+/); return (parts[0][0]+(parts[1]?parts[1][0]:"")).toUpperCase(); }
function mapsUrl(name,address){ var q=[name,address].filter(Boolean).join(" "); return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q); }
function webSearchUrl(name,address){ var q=[name,address,"menu"].filter(Boolean).join(" "); return "https://www.google.com/search?q="+encodeURIComponent(q); }
function faviconUrl(website){
  try{ var host = new URL(website).hostname; return "https://www.google.com/s2/favicons?domain="+encodeURIComponent(host)+"&sz=32"; }
  catch(e){ return null; }
}

function starSvg(fill){
  var gid = "g"+Math.random().toString(36).slice(2,8);
  if(fill==="full") return '<svg viewBox="0 0 20 20"><path fill="var(--gold)" d="M10 1.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L1.3 7.8l6.1-.7z"/></svg>';
  if(fill==="half") return '<svg viewBox="0 0 20 20"><defs><linearGradient id="'+gid+'" x1="0" x2="1"><stop offset="50%" stop-color="var(--gold)"/><stop offset="50%" stop-color="var(--border)"/></linearGradient></defs><path fill="url(#'+gid+')" d="M10 1.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L1.3 7.8l6.1-.7z"/></svg>';
  return '<svg viewBox="0 0 20 20"><path fill="var(--border)" d="M10 1.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L1.3 7.8l6.1-.7z"/></svg>';
}
function starsHtml(value){
  value = Math.round((value||0)*2)/2;
  var out = '<span class="stars">';
  for(var i=1;i<=5;i++){
    if(value>=i) out += starSvg("full");
    else if(value>=i-0.5) out += starSvg("half");
    else out += starSvg("empty");
  }
  return out+'</span>';
}
function avgRating(ratings){
  if(!ratings) return null;
  var vals = Object.values(ratings).filter(function(v){ return typeof v==="number" && v>0; });
  if(!vals.length) return null;
  return vals.reduce(function(a,b){return a+b;},0)/vals.length;
}
function friendlyAuthError(err){

  var map = {

    "auth/invalid-email": "That doesn't look like a valid email address.",

/* ---------------- Firestore store ---------------- */
var store = {
  ensureSpace: function(code){
    var ref = doc(dbase, "spaces", code);
    return getDoc(ref).then(function(snap){
      if(snap.exists()) return snap.data();
      var fresh = { categories: DEFAULT_CATEGORIES.slice(), people: [], createdAt: new Date().toISOString() };
      return setDoc(ref, fresh).then(function(){ return fresh; });
    });
  },
  updateSpace: function(code, patch){ return updateDoc(doc(dbase,"spaces",code), patch); },
  subscribeSpace: function(code, cb){
    return onSnapshot(doc(dbase,"spaces",code), function(snap){ if(snap.exists()) cb(snap.data()); }, function(){});
  },
  subscribePlaces: function(code, cb){
    return onSnapshot(collection(dbase,"spaces",code,"places"), function(snap){
      cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
    }, function(){});
  },
  savePlace: function(code, id, data){ return setDoc(doc(dbase,"spaces",code,"places",id), data); },
  deletePlace: function(code, id){ return deleteDoc(doc(dbase,"spaces",code,"places",id)); },
  getUserProfile: function(theUid){ return getDoc(doc(dbase,"users",theUid)).then(function(s){ return s.exists()?s.data():null; }); },
  saveUserProfile: function(theUid, data){ return setDoc(doc(dbase,"users",theUid), data, {merge:true}); }
};

function fileToCompressedDataUrl(file, maxDim, quality){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w=img.width, h=img.height;
        if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        var canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ reject(new Error("Couldn't read that image")); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error("Couldn't read that file")); };
    reader.readAsDataURL(file);
  });
}

function enterSpace(code){
  S.spaceCode = code; S.loadingSpace = true; persistSpace();
  teardownSubs();
  render();
  store.ensureSpace(code).then(function(space){
    S.space = space; S.loadingSpace = false;
    var already = (space.people||[]).some(function(p){ return p.uid===S.meUid; });
    if(!already){
      var people = (space.people||[]).concat([{uid:S.meUid, name:S.me}]);
      store.updateSpace(code, {people: people});
    }
    unsubs.push(store.subscribeSpace(code, function(sp){ S.space = sp; preserveSheetInput(); render(); }));
    unsubs.push(store.subscribePlaces(code, function(pl){ S.places = pl; preserveSheetInput(); render(); }));
    render();
  }).catch(function(err){
    S.loadingSpace = false; S.spaceCode = null; forgetLocalSpace();
    showToast("Couldn't open that list — check the code and try again");
  });
}

function doSignOut(){
  teardownSubs();

  if(S.categoryFilter){
    var verb = kind==="been" ? "logged" : "on your want-to-go list";
    return '<div class="empty"><span class="fork">'+emoji+'</span><p>No '+escapeHtml(S.categoryFilter)+' spots '+verb+' yet. Tap + to add one, or pick "All" above to see everything else.</p></div>';
  }
  if(kind==="been") return '<div class="empty"><span class="fork">🌮</span><p>No places yet. Tap + to log the best taco spot in town.</p></div>';
  return '<div class="empty"><span class="fork">📍</span><p>Nothing on your list to try yet. Add a place you have been wanting to check out.</p></div>';
}
function beenTabHtml(){

  else list = list.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  if(!list.length) return emptyStateHtml("been");

function wantTabHtml(){

/* ---------------- Sheet ---------------- */
function blankPlace(status){
  return { id: uid(), name:"", category:(S.space.categories||[])[0]||"", status: status||"want", address:"", website:"",
    price:0, notes:"", tags:[], photos:[], ratings:{}, visitDate:"", wouldReturn:null, addedBy:S.meUid, createdAt: new Date().toISOString(), isNew:true };
}
function normalizeUrl(u){
  u = (u||"").trim();
  if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://"+u;
  return u;
}
function sheetHtml(){ return S.sheet.type==="edit" ? editSheetHtml(S.sheet.place) : ""; }
function editSheetHtml(p){
  var cats = S.space.categories||[];
  var isNew = !!p.isNew;
  var myRating = (p.ratings && p.ratings[S.meUid]) || 0;
  var others = Object.keys(p.ratings||{}).filter(function(k){return k!==S.meUid && p.ratings[k]>0;});
  var html = '<div class="overlay" id="sheet-overlay"><div class="sheet">';
  html += '<div class="sheet-header"><h2>'+(isNew?"Add a place":"Edit place")+'</h2><button class="icon-btn" id="sheet-close">'+iconClose()+'</button></div><div class="sheet-body">';
  html += '<div class="segment" style="margin-bottom:16px;"><button class="'+(p.status==="want"?"active":"")+'" data-set-status="want">Want to go</button>'+
    '<button class="'+(p.status==="been"?"active":"")+'" data-set-status="been">Been there</button></div>';
  html += '<div class="field"><label for="f-name">Name</label><input type="text" id="f-name" value="'+escapeHtml(p.name)+'" placeholder="e.g. El Camion"></div>';
  var catOptions = cats.slice();
  if(p.category && catOptions.indexOf(p.category)===-1) catOptions.unshift(p.category);
  html += '<div class="field"><label for="f-category">Category</label><div class="cat-row"><select id="f-category">'+
    catOptions.map(function(c){ return '<option value="'+escapeHtml(c)+'"'+(c===p.category?" selected":"")+'>'+escapeHtml(c)+'</option>'; }).join("")+
    '<option value="__new__">+ New category…</option></select></div></div>';
  html += '<div class="field"><label for="f-address">Location <span style="text-transform:none;font-weight:400;">(optional)</span></label><input type="text" id="f-address" value="'+escapeHtml(p.address)+'" placeholder="Street, neighborhood, or city"></div>';
  if(p.address) html += '<div style="margin:-8px 0 14px;"><a href="'+mapsUrl(p.name,p.address)+'" target="_blank" rel="noopener" style="font-size:13px;font-weight:600;">'+iconMap()+' Open in Maps</a></div>';
  html += '<div class="field"><label for="f-website">Website or menu <span style="text-transform:none;font-weight:400;">(optional)</span></label>'+
    '<input type="text" id="f-website" value="'+escapeHtml(p.website||"")+'" placeholder="https://…">'+
    '<div style="display:flex;gap:8px;margin-top:8px;">'+
    '<button type="button" class="btn btn-secondary btn-sm" id="website-paste-btn" style="flex:1;">Paste</button>'+
    '<button type="button" class="btn btn-secondary btn-sm" id="website-search-btn" style="flex:1;">Search</button>'+
    '</div></div>';
  if(p.status==="been"){
    html += '<div class="field"><label>Price</label><div class="price-select">'+[1,2,3,4].map(function(n){ return '<button class="'+(p.price===n?"active":"")+'" data-price="'+n+'">'+Array(n+1).join("$")+'</button>'; }).join("")+'</div></div>';
    html += '<div class="field"><label>Your rating</label><div class="star-input" id="rating-input">'+[1,2,3,4,5].map(function(i){
        var fill = myRating>=i ? "full" : (myRating>=i-0.5 ? "half" : "empty");
        return '<button data-star="'+i+'">'+starSvg(fill)+'</button>';
      }).join("")+'</div></div>';
    if(others.length) html += '<div class="others-ratings">'+others.map(function(k){ return '<div class="row"><span>'+escapeHtml(personName(k))+'</span>'+starsHtml(p.ratings[k])+'</div>'; }).join("")+'</div>';
    html += '<div class="field"><label for="f-date">Visit date</label><input type="date" id="f-date" value="'+escapeHtml(p.visitDate||"")+'"></div>';
    html += '<div class="field"><label>Would you go back?</label><div class="segment">'+["yes","unsure","no"].map(function(v){ return '<button class="'+(p.wouldReturn===v?"active":"")+'" data-return="'+v+'">'+v.charAt(0).toUpperCase()+v.slice(1)+'</button>'; }).join("")+'</div></div>';
  }
  if(p.status==="want"){
    html += '<div class="field"><label for="f-notes">Dishes to try <span style="text-transform:none;font-weight:400;">(optional)</span></label><textarea id="f-notes" placeholder="Tacos al pastor, the mole, whatever\'s seasonal…">'+escapeHtml(p.notes||"")+'</textarea></div>';
  } else {
    html += '<div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" placeholder="What did you order? What stood out?">'+escapeHtml(p.notes||"")+'</textarea></div>';
  }
  html += '<div class="field"><label>Tags</label><div class="tag-input-row"><input type="text" id="f-tag-input" placeholder="e.g. patio, date night"><button class="btn btn-secondary btn-sm" id="f-tag-add">Add</button></div>'+
    '<div class="chips-edit" id="tag-chips">'+(p.tags||[]).map(function(t,i){ return '<div class="chip-edit">'+escapeHtml(t)+'<button data-tag-del="'+i+'">'+iconClose()+'</button></div>'; }).join("")+'</div></div>';
  if(p.status==="been"){
    html += '<div class="field"><label>Photos '+(p.photos&&p.photos.length?('<span style="text-transform:none;font-weight:400;">('+p.photos.length+'/'+MAX_PHOTOS+')</span>'):'')+'</label><div class="photo-row" id="photo-row">'+
      (p.photos||[]).map(function(src,i){ return '<div class="photo-thumb"><img src="'+src+'" alt=""><button data-photo-del="'+i+'">'+iconClose()+'</button></div>'; }).join("")+
      ((p.photos||[]).length < MAX_PHOTOS ? '<button class="photo-add" id="photo-add-btn">'+iconCamera()+'<span>Add</span></button><input type="file" id="photo-file" accept="image/*" style="display:none;">' : "")+
      '</div></div>';
  }
  if(!isNew){
    if(S.confirmDeleteId===p.id){
      html += '<div class="confirm-box"><p>Delete this place for everyone on the list? This can\'t be undone.</p><div class="row"><button class="btn btn-secondary btn-block" id="del-cancel">Cancel</button><button class="btn btn-danger btn-block" id="del-confirm">Delete</button></div></div>';
    } else {
      html += '<button class="btn btn-danger" id="del-start" style="margin-top:4px;">'+iconTrash()+' Delete place</button>';
    }
  }
  html += '</div><div class="sheet-footer"><button class="btn btn-secondary btn-block" id="sheet-cancel">Cancel</button><button class="btn btn-primary btn-block" id="sheet-save">Save</button></div></div></div>';
  return html;
}

/* ---------------- Bindings ---------------- */
function bindShell(){
  var el;
  document.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick = function(){ S.tab=b.getAttribute("data-tab"); S.categoryFilter=null; S.search=""; S.shuffleResult=null; render(); }; });
  if((el=document.getElementById("fab-add"))) el.onclick = function(){ S.sheet={type:"edit", place: blankPlace(S.tab==="been"?"been":"want")}; S.confirmDeleteId=null; render(); };
  document.querySelectorAll("[data-cat]").forEach(function(b){ b.onclick=function(){ S.categoryFilter=b.getAttribute("data-cat")||null; render(); }; });
  document.querySelectorAll("[data-sort]").forEach(function(b){ b.onclick=function(){ S.sortBeen=b.getAttribute("data-sort"); render(); }; });
  if((el=document.getElementById("search-input"))){
    el.oninput = function(){
      var pos = this.selectionStart; S.search = this.value; render();
      var el2 = document.getElementById("search-input");
      if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(e){} }
    };
  }
  document.querySelectorAll(".place-card").forEach(function(card){
    card.onclick = function(e){
      if(e.target.closest("[data-mark-been]")) return;
      if(e.target.closest("a")) return;
      var id = card.getAttribute("data-id");
      var p = S.places.filter(function(x){return x.id===id;})[0];
      if(p){ S.sheet={type:"edit", place: Object.assign({}, p)}; S.confirmDeleteId=null; render(); }
    };
  });
  document.querySelectorAll("[data-mark-been]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var id = b.getAttribute("data-mark-been");
      var p = S.places.filter(function(x){return x.id===id;})[0];
      if(p){ var np = Object.assign({}, p, {status:"been", visitDate: p.visitDate || new Date().toISOString().slice(0,10)}); S.sheet={type:"edit", place: np}; render(); }
    };
  });
  document.querySelectorAll("[data-shuffle-mode]").forEach(function(b){ b.onclick=function(){ S.shuffleMode=b.getAttribute("data-shuffle-mode"); S.shuffleResult=null; render(); }; });
  document.querySelectorAll("[data-shuffle-cat]").forEach(function(b){ b.onclick=function(){ S.shuffleCategory=b.getAttribute("data-shuffle-cat")||null; S.shuffleResult=null; render(); }; });
  if((el=document.getElementById("shuffle-go"))) el.onclick = runShuffle;
  if((el=document.getElementById("shuffle-again"))) el.onclick = runShuffle;
  if((el=document.getElementById("shuffle-view"))) el.onclick = function(){ S.sheet={type:"edit", place: Object.assign({}, S.shuffleResult)}; render(); };

  if((el=document.getElementById("copy-code"))) el.onclick = function(){
    var text = S.spaceCode;
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ showToast("Code copied"); }); }
    else { showToast("Your code: "+text); }
  };
  if((el=document.getElementById("rename-me"))) el.onclick = function(){
    var name = prompt("Your name", S.me);
    if(name && name.trim()){
      S.me = name.trim();
      store.saveUserProfile(S.meUid, {displayName:S.me});
      var people = (S.space.people||[]).slice();
      var idx = people.findIndex(function(p){return p.uid===S.meUid;});
      if(idx>-1) people[idx] = {uid:S.meUid, name:S.me}; else people.push({uid:S.meUid, name:S.me});
      store.updateSpace(S.spaceCode, {people: people});
      render();
    }
  };
  if((el=document.getElementById("switch-list"))) el.onclick = function(){ teardownSubs(); S.spaceCode=null; S.places=[]; render(); };
  if((el=document.getElementById("sign-out-btn"))) el.onclick = doSignOut;

  document.querySelectorAll("[data-cat-edit]").forEach(function(inp){
    inp.onchange = function(){
      var i = +inp.getAttribute("data-cat-edit");
      var cats = (S.space.categories||[]).slice();
      var oldName = cats[i];
      cats[i] = inp.value.trim() || oldName;
      store.updateSpace(S.spaceCode, {categories: cats});
      if(cats[i]!==oldName){
        S.places.filter(function(p){return p.category===oldName;}).forEach(function(p){
          var data = Object.assign({}, p, {category: cats[i]}); delete data.id;
          store.savePlace(S.spaceCode, p.id, data);
        });
      }
      render();
    };
  });
  document.querySelectorAll("[data-cat-del]").forEach(function(b){
    b.onclick = function(){
      var i = +b.getAttribute("data-cat-del");
      var cats = (S.space.categories||[]).slice(); cats.splice(i,1);
      store.updateSpace(S.spaceCode, {categories: cats}); render();
    };
  });
  if((el=document.getElementById("new-cat-add"))) el.onclick = function(){
    var inp = document.getElementById("new-cat-input");
    var v = inp.value.trim(); if(!v) return;
    var cats = (S.space.categories||[]).slice();
    if(cats.indexOf(v)===-1) cats.push(v);
    store.updateSpace(S.spaceCode, {categories: cats});
    inp.value=""; render();
  };
  bindSheet();
}

function runShuffle(){
  var pool = S.places.filter(function(p){
    if(S.shuffleCategory && p.category!==S.shuffleCategory) return false;
    if(S.shuffleMode==="new") return (p.status||"want")==="want";
    if((p.status||"want")!=="been") return false;
    var avg = avgRating(p.ratings);
    return avg==null || avg>=4;
  });
  if(!pool.length){
    pool = S.places.filter(function(p){
      if(S.shuffleCategory && p.category!==S.shuffleCategory) return false;
      return S.shuffleMode==="new" ? (p.status||"want")==="want" : (p.status||"want")==="been";
    });
  }
  if(!pool.length){ showToast("Nothing to pick from yet"); S.shuffleResult=null; render(); return; }
  var pick, guard=0;
  do { pick = pool[Math.floor(Math.random()*pool.length)]; guard++; } while(pool.length>1 && S.shuffleResult && pick.id===S.shuffleResult.id && guard<20);
  S.shuffleResult = pick; render();
}

function bindSheet(){
  if(!S.sheet) return;
  var el;
  var overlay = document.getElementById("sheet-overlay");
  if(overlay) overlay.onclick = function(e){ if(e.target===overlay) closeSheet(); };
  if((el=document.getElementById("sheet-close"))) el.onclick = closeSheet;
  if((el=document.getElementById("sheet-cancel"))) el.onclick = closeSheet;
  var place = S.sheet.place;

  document.querySelectorAll("[data-set-status]").forEach(function(b){ b.onclick=function(){ place.status=b.getAttribute("data-set-status"); syncSheetFieldsIntoPlace(place); render(); }; });
  document.querySelectorAll("[data-price]").forEach(function(b){ b.onclick=function(){ var n=+b.getAttribute("data-price"); place.price = place.price===n?0:n; syncSheetFieldsIntoPlace(place); render(); }; });
  document.querySelectorAll("[data-return]").forEach(function(b){ b.onclick=function(){ place.wouldReturn=b.getAttribute("data-return"); syncSheetFieldsIntoPlace(place); render(); }; });
  document.querySelectorAll("[data-star]").forEach(function(b){
    b.onclick = function(){
      var i = +b.getAttribute("data-star");
      var cur = (place.ratings && place.ratings[S.meUid]) || 0;
      var next = cur===i ? i-0.5 : (cur===i-0.5 ? 0 : i);
      place.ratings = Object.assign({}, place.ratings); place.ratings[S.meUid] = next;
      syncSheetFieldsIntoPlace(place); render();
    };
  });
  if((el=document.getElementById("f-category"))){
    el.onchange = function(){
      if(this.value==="__new__"){
        var v = prompt("New category name");
        if(v && v.trim()){
          var cats = (S.space.categories||[]).slice(); cats.push(v.trim());
          store.updateSpace(S.spaceCode, {categories:cats});
          place.category = v.trim();
        }
        syncSheetFieldsIntoPlace(place); render();
      } else { place.category = this.value; }
    };
  }
  if((el=document.getElementById("website-search-btn"))){
    el.onclick = function(){
      var name = (document.getElementById("f-name")||{}).value || place.name || "";
      var addr = (document.getElementById("f-address")||{}).value || place.address || "";
      if(!name.trim()){ showToast("Add a name first"); return; }
      window.open(webSearchUrl(name, addr), "_blank", "noopener");
    };
  }
  if((el=document.getElementById("website-paste-btn"))){
    el.onclick = function(){
      if(!(navigator.clipboard && navigator.clipboard.readText)){ showToast("Clipboard paste isn't supported here — paste manually"); return; }
      navigator.clipboard.readText().then(function(text){
        text = (text||"").trim();
        if(!text){ showToast("Clipboard is empty"); return; }
        syncSheetFieldsIntoPlace(place);
        place.website = text;
        render();
        showToast("Pasted");
      }).catch(function(){ showToast("Couldn't read clipboard — paste manually"); });
    };
  }
  if((el=document.getElementById("f-tag-add"))){
    el.onclick = function(){
      var inp = document.getElementById("f-tag-input"); var v = inp.value.trim(); if(!v) return;
      place.tags = (place.tags||[]).concat([v]); syncSheetFieldsIntoPlace(place); render();
    };
  }
  document.querySelectorAll("[data-tag-del]").forEach(function(b){
    b.onclick = function(){ var i=+b.getAttribute("data-tag-del"); place.tags=(place.tags||[]).slice(); place.tags.splice(i,1); syncSheetFieldsIntoPlace(place); render(); };
  });
  document.querySelectorAll("[data-photo-del]").forEach(function(b){
    b.onclick = function(){ var i=+b.getAttribute("data-photo-del"); place.photos=(place.photos||[]).slice(); place.photos.splice(i,1); syncSheetFieldsIntoPlace(place); render(); };
  });
  if((el=document.getElementById("photo-add-btn"))) el.onclick = function(){ document.getElementById("photo-file").click(); };
  if((el=document.getElementById("photo-file"))){
    el.onchange = function(){
      var file = this.files && this.files[0]; if(!file) return;
      showToast("Adding photo…");
      fileToCompressedDataUrl(file, 640, 0.55).then(function(dataUrl){
        place.photos = (place.photos||[]).concat([dataUrl]);
        syncSheetFieldsIntoPlace(place); render();
      }).catch(function(){ showToast("Couldn't add that photo"); });
    };
  }
  if((el=document.getElementById("del-start"))) el.onclick = function(){ S.confirmDeleteId = place.id; render(); };
  if((el=document.getElementById("del-cancel"))) el.onclick = function(){ S.confirmDeleteId = null; render(); };
  if((el=document.getElementById("del-confirm"))) el.onclick = function(){
    store.deletePlace(S.spaceCode, place.id).then(function(){
      showToast("Place deleted"); S.confirmDeleteId=null; S.sheet=null; S.shuffleResult=null; render();
    });
  };
  if((el=document.getElementById("sheet-save"))) el.onclick = function(){
    syncSheetFieldsIntoPlace(place);
    if(!place.name || !place.name.trim()){ showToast("Give it a name first"); return; }
    place.website = normalizeUrl(place.website);
    var data = Object.assign({}, place);
    var id = data.id; delete data.id; delete data.isNew;
    store.savePlace(S.spaceCode, id, data).then(function(){
      showToast("Saved"); S.sheet=null; S.confirmDeleteId=null; render();
    }).catch(function(){ showToast("Couldn't save — try again"); });
  };
}
function syncSheetFieldsIntoPlace(place){
  var el;
  if((el=document.getElementById("f-name"))) place.name = el.value;
  if((el=document.getElementById("f-address"))) place.address = el.value;
  if((el=document.getElementById("f-website"))) place.website = el.value;
  if((el=document.getElementById("f-date"))) place.visitDate = el.value;
  if((el=document.getElementById("f-notes"))) place.notes = el.value;
}
function preserveSheetInput(){ if(S.sheet && S.sheet.place) syncSheetFieldsIntoPlace(S.sheet.place); }
function closeSheet(){ S.sheet=null; S.confirmDeleteId=null; render(); }

/* ---------------- Boot ---------------- */
onAuthStateChanged(auth, function(user){
  S.authChecked = true; S.authBusy = false;
  if(!user){ S.authUser=null; S.meUid=null; S.me=null; render(); return; }
  S.authUser = user; S.meUid = user.uid;
  store.getUserProfile(user.uid).then(function(profile){
    if(profile && profile.displayName){
      S.me = profile.displayName; S.needsName = false;
      var last = loadLocalSpace();
      if(last && !S.spaceCode) enterSpace(last); else render();
    } else {
      S.needsName = true; render();
    }
  }).catch(function(){ S.needsName = true; render(); });
});

render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
