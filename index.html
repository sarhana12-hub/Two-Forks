  document.querySelectorAll("[data-hh-enabled]").forEach(function(b){
    b.onclick = function(){
      syncSheetFieldsIntoPlace(place);
      place.happyHour.enabled = b.getAttribute("data-hh-enabled")==="1";
      render();
    };
  });
  document.querySelectorAll("[data-hh-day-toggle]").forEach(function(b){
    b.onclick = function(){
      syncSheetFieldsIntoPlace(place);
      var key = b.getAttribute("data-hh-day-toggle");
      var day = place.happyHour.days[key];
      day.active = !day.active;
      if(day.active && !day.start && !day.end){
        var bs = (document.getElementById("hh-bulk-start")||{}).value;
        var be = (document.getElementById("hh-bulk-end")||{}).value;
        if(bs) day.start = bs;
        if(be) day.end = be;
      }
      render();
    };
  });
  if((el=document.getElementById("hh-apply-all"))){
    el.onclick = function(){
      syncSheetFieldsIntoPlace(place);
      var start = document.getElementById("hh-bulk-start").value;
      var end = document.getElementById("hh-bulk-end").value;
      DAYS_OF_WEEK.forEach(function(d){
        var day = place.happyHour.days[d.key];
        if(day.active){ day.start = start; day.end = end; }
      });
      render();
    };
  }
  document.querySelectorAll("[data-cat-toggle]").forEach(function(b){
    b.onclick = function(){
      var c = b.getAttribute("data-cat-toggle");
      var cats = getCategories(place).slice();
      var idx = cats.indexOf(c);
      if(idx>-1) cats.splice(idx,1); else cats.push(c);
      place.categories = cats; delete place.category;
      syncSheetFieldsIntoPlace(place); render();
    };
  });
  if((el=document.getElementById("cat-add-chip"))){
    el.onclick = function(){
      S.sheet.addingCategory = true;
      syncSheetFieldsIntoPlace(place); render();
      var inp = document.getElementById("f-new-cat");
      if(inp) inp.focus();
    };
  }
  if((el=document.getElementById("f-new-cat"))){
    el.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("f-cat-add").click(); } };
  }
  if((el=document.getElementById("f-cat-add"))){
    el.onclick = function(){
      var inp = document.getElementById("f-new-cat");
      var v = inp.value.trim(); if(!v) return;
      var spaceCats = (S.space.categories||[]).slice();
      if(spaceCats.indexOf(v)===-1){ spaceCats.push(v); store.updateSpace(S.spaceCode, {categories: spaceCats}); }
      var cats = getCategories(place).slice();
      if(cats.indexOf(v)===-1) cats.push(v);
      place.categories = cats; delete place.category;
      S.sheet.addingCategory = false;
      syncSheetFieldsIntoPlace(place); render();
    };
  }
  if((el=document.getElementById("lookup-btn"))){
    el.onclick = function(){
      syncSheetFieldsIntoPlace(place);
      var name = (place.name||"").trim();
      if(!name){ showToast("Add a name first"); var n=document.getElementById("f-name"); if(n) n.focus(); return; }
      S.sheet.lookupBusy = true; S.sheet.lookupResults = null; render();
      var sheetRef = S.sheet;
      lookupPlace(name).then(function(res){
        if(S.sheet!==sheetRef) return;
        sheetRef.lookupBusy = false; sheetRef.lookupResults = res; render();
      });
    };
  }
  document.querySelectorAll("[data-use-result]").forEach(function(b){ b.onclick=function(){
    var r = S.sheet.lookupResults[+b.getAttribute("data-use-result")]; if(!r) return;
    var dup = (r.placeId ? S.places.filter(function(x){ return x.placeId===r.placeId && x.id!==place.id; })[0] : null) ||
              (place.isNew && r.name ? S.places.filter(function(x){ return normName(x.name)===normName(r.name) && x.id!==place.id; })[0] : null);
    if(dup){ showToast("That's already on your list as "+dup.name); return; }
    syncSheetFieldsIntoPlace(place);
    applyLookupToPlace(place, r, {takeName: !!place.isNew});
    S.sheet.lookupResults = null; S.sheet.lookupSource = r.source;
    render();
  }; });
  if((el=document.getElementById("lookup-dismiss"))) el.onclick = function(){ S.sheet.lookupResults = null; render(); };
  if((el=document.getElementById("lookup-again-btn"))) el.onclick = function(){ syncSheetFieldsIntoPlace(place); clearLookupFromPlace(place); S.sheet.lookupResults = null; render(); };
  if((el=document.getElementById("locate-btn"))){
    el.onclick = function(){
      syncSheetFieldsIntoPlace(place);
      var addr = (place.address||"").trim();
      if(!addr){ showToast("Type an address first"); var a=document.getElementById("f-address"); if(a) a.focus(); return; }
      S.sheet.locateBusy = true; render();
      var sheetRef = S.sheet;
      locateAddress(addr).then(function(res){
        if(S.sheet!==sheetRef) return;
        sheetRef.locateBusy = false;
        if(res.length){
          var r = res[0];
          place.address = r.address || addr; place.lat = r.lat; place.lng = r.lng; place.placeId = null;
          place.locationSource = r.source==="osm" ? "osm" : "google-geocode";
          if(!place.neighborhood){ var hood = guessNeighborhood(r.lat, r.lng); if(hood) place.neighborhood = hood; }
          showToast("Pinned on the map");
        } else {
          showToast("Couldn't find that address — check it and try again");
        }
        render();
      });
    };
  }
  if((el=document.getElementById("f-address"))) el.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); var lb=document.getElementById("locate-btn"); if(lb) lb.click(); } };
  if((el=document.getElementById("website-search-btn"))){
    el.onclick = function(){
      var name = (document.getElementById("f-name")||{}).value || place.name || "";
      var neighborhoodVal = (document.getElementById("f-neighborhood")||{}).value || place.neighborhood || "";
      var loc = locationQueryHint(place.address, neighborhoodVal);
      var cityHint = place.address ? "" : neighborhoodCityHint(neighborhoodVal);
      var hood = [loc, cityHint].filter(Boolean).join(" ");
      if(!name.trim()){ showToast("Add a name first"); return; }
      window.open(webSearchUrl(name, hood), "_blank", "noopener");
    };
  }
  if((el=document.getElementById("website-paste-btn"))){
    el.onclick = function(){
      if(!(navigator.clipboard && navigator.clipboard.readText)){ showToast("Clipboard paste isn't supported here — paste manually"); return; }
      navigator.clipboard.readText().then(function(text){
        text = (text||"").trim();
        if(!text){ showToast("Clipboard is empty"); return; }
        syncSheetFieldsIntoPlace(place);
        place.website = text;
        render();
        showToast("Pasted");
      }).catch(function(){ showToast("Couldn't read clipboard — paste manually"); });
    };
  }
  if((el=document.getElementById("hh-menu-search-btn"))){
    el.onclick = function(){
      var name = (document.getElementById("f-name")||{}).value || place.name || "";
      var neighborhoodVal = (document.getElementById("f-neighborhood")||{}).value || place.neighborhood || "";
      var loc = locationQueryHint(place.address, neighborhoodVal);
      var cityHint = place.address ? "" : neighborhoodCityHint(neighborhoodVal);
      var hood = [loc, cityHint].filter(Boolean).join(" ");
      if(!name.trim()){ showToast("Add a name first"); return; }
      window.open(webSearchUrl(name, hood, "happy hour menu"), "_blank", "noopener");
    };
  }
  if((el=document.getElementById("hh-menu-paste-btn"))){
    el.onclick = function(){
      if(!(navigator.clipboard && navigator.clipboard.readText)){ showToast("Clipboard paste isn't supported here — paste manually"); return; }
      navigator.clipboard.readText().then(function(text){
        text = (text||"").trim();
        if(!text){ showToast("Clipboard is empty"); return; }
        syncSheetFieldsIntoPlace(place);
        place.happyHourMenuUrl = text;
        render();
        showToast("Pasted");
      }).catch(function(){ showToast("Couldn't read clipboard — paste manually"); });
    };
  }
  function addTagFromInput(){
    var inp = document.getElementById("f-tag-input"); var v = inp.value.trim(); if(!v) return;
    if((place.tags||[]).some(function(t){ return t.toLowerCase()===v.toLowerCase(); })){ inp.value=""; return; }
    place.tags = (place.tags||[]).concat([v]); syncSheetFieldsIntoPlace(place); render();
    var again = document.getElementById("f-tag-input"); if(again) again.focus();
  }
  if((el=document.getElementById("f-tag-add"))) el.onclick = addTagFromInput;
  if((el=document.getElementById("f-tag-input"))) el.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); addTagFromInput(); } };
  document.querySelectorAll("[data-tag-del]").forEach(function(b){
    b.onclick = function(){ var i=+b.getAttribute("data-tag-del"); place.tags=(place.tags||[]).slice(); place.tags.splice(i,1); syncSheetFieldsIntoPlace(place); render(); };
  });
  document.querySelectorAll("[data-cover-del]").forEach(function(b){
    b.onclick = function(){ place.coverPhoto = null; syncSheetFieldsIntoPlace(place); render(); };
  });
  if((el=document.getElementById("cover-photo-add-btn"))) el.onclick = function(){ document.getElementById("cover-photo-file").click(); };
  if((el=document.getElementById("cover-photo-file"))){
    el.onchange = function(){
      var file = this.files && this.files[0]; if(!file) return;
      showToast("Adding photo…");
      fileToCompressedDataUrl(file, 640, 0.55).then(function(dataUrl){
        if(!photoFits(place, dataUrl)){ showToast("This place is out of photo room — remove a review photo first"); return; }
        place.coverPhoto = dataUrl;
        syncSheetFieldsIntoPlace(place); render();
      }).catch(function(){ showToast("Couldn't add that photo"); });
    };
  }
  if((el=document.getElementById("add-review-btn"))){
    el.onclick = function(){ syncSheetFieldsIntoPlace(place); openReviewDraft(null); render(); };
  }
  document.querySelectorAll("[data-review-row]").forEach(function(row){
    row.onclick = function(e){
      if(e.target.closest("[data-review-edit]") || e.target.closest("[data-review-del]")) return;
      var id = row.getAttribute("data-review-row");
      var r = (place.reviews||[]).filter(function(x){return x.id===id;})[0];
      syncSheetFieldsIntoPlace(place);
      if(r) openReviewDraft(r, "view");
      render();
    };
  });
  document.querySelectorAll("[data-review-edit]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var id = b.getAttribute("data-review-edit");
      var r = (place.reviews||[]).filter(function(x){return x.id===id;})[0];
      syncSheetFieldsIntoPlace(place);
      if(r) openReviewDraft(r, "edit");
      render();
    };
  });
  document.querySelectorAll("[data-review-del]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      S.confirmDeleteReviewId = b.getAttribute("data-review-del");
      render();
    };
  });
  document.querySelectorAll("[data-review-del-cancel]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      S.confirmDeleteReviewId = null;
      render();
    };
  });
  document.querySelectorAll("[data-review-del-confirm]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var id = b.getAttribute("data-review-del-confirm");
      place.reviews = (place.reviews||[]).filter(function(x){return x.id!==id;});
      S.confirmDeleteReviewId = null;
      syncSheetFieldsIntoPlace(place);
      if(place.isNew){ render(); return; }
      persistPlaceQuiet(place, "Review deleted");
    };
  });
  if(S.sheet.reviewDraft) bindReviewSheet(place);
  if((el=document.getElementById("del-start"))) el.onclick = function(){ S.confirmDeleteId = place.id; render(); };
  if((el=document.getElementById("del-cancel"))) el.onclick = function(){ S.confirmDeleteId = null; render(); };
  if((el=document.getElementById("del-confirm"))) el.onclick = function(){
    store.deletePlace(S.spaceCode, place.id).then(function(){
      showToast("Place deleted"); S.confirmDeleteId=null; S.sheet=null; S.shuffleResult=null; render();
    });
  };
  if((el=document.getElementById("sheet-save"))) el.onclick = function(){
    syncSheetFieldsIntoPlace(place);
    place.name = (place.name||"").trim();
    if(!place.name){ showToast("Give it a name first"); var n=document.getElementById("f-name"); if(n) n.focus(); return; }
    place.website = normalizeUrl(place.website);
    place.happyHourMenuUrl = normalizeUrl(place.happyHourMenuUrl);
    place.tags = (place.tags||[]).map(function(t){ return String(t).trim(); }).filter(Boolean);
    mergeLiveReviews(place);
    var data = Object.assign({}, place);
    var id = data.id; delete data.id; delete data.isNew;
    store.savePlace(S.spaceCode, id, data).then(function(){
      showToast("Saved"); S.sheet=null; S.confirmDeleteId=null; S.confirmDeleteReviewId=null; render();
      setTimeout(function(){ computeAndStoreTravel(id); }, 50);
    }).catch(function(){ showToast("Couldn't save — try again"); });
  };
}
// The sheet works on a copy taken when it opened. If a partner added or
// edited a review in the meantime, a plain overwrite would wipe it; fold in
// any review we don't have, keeping our own version of ones we touched.
function mergeLiveReviews(place){
  var live = S.places.filter(function(x){ return x.id===place.id; })[0];
  if(!live) return;
  var mine = place.reviews||[];
  var mineIds = {}; mine.forEach(function(r){ if(r&&r.id) mineIds[r.id]=true; });
  var originalIds = {}; ((S.sheet && S.sheet.originalPlace && S.sheet.originalPlace.reviews)||[]).forEach(function(r){ if(r&&r.id) originalIds[r.id]=true; });
  var extra = (live.reviews||[]).filter(function(r){ return r && r.id && !mineIds[r.id] && !originalIds[r.id]; });
  if(extra.length) place.reviews = mine.concat(extra);
}
function bindFindSheet(){
  var el, f = S.sheet;
  var overlay = document.getElementById("sheet-overlay");
  if(overlay) overlay.onclick = function(e){ if(e.target===overlay) closeSheet(); };
  if((el=document.getElementById("sheet-close"))) el.onclick = closeSheet;
  if((el=document.getElementById("find-input"))) el.oninput = function(){ f.query = this.value; };
  if((el=document.getElementById("find-form"))) el.onsubmit = function(e){
    e.preventDefault();
    var q = (document.getElementById("find-input").value||"").trim();
    if(!q){ showToast("Type the restaurant's name first"); return; }
    f.query = q; f.busy = true; f.results = null; render();
    lookupPlace(q).then(function(res){
      if(S.sheet!==f) return;
      f.busy = false; f.results = res; render();
    });
  };
  document.querySelectorAll("[data-pick-result]").forEach(function(b){ b.onclick=function(){
    var r = f.results[+b.getAttribute("data-pick-result")]; if(!r) return;
    startPlaceFromResult(r, f.status);
  }; });
  if((el=document.getElementById("find-manual-btn"))) el.onclick = function(){
    var place = blankPlace(f.status, S.categoryFilter);
    place.name = (f.query||"").trim();
    openPlaceSheet(place, "edit"); render();
    setTimeout(function(){ var n=document.getElementById(place.name ? "f-address" : "f-name"); if(n) n.focus(); }, 50);
  };
}
function syncSheetFieldsIntoPlace(place){
  var el;
  if((el=document.getElementById("f-name"))) place.name = el.value;
  if((el=document.getElementById("f-neighborhood"))) place.neighborhood = el.value;
  if((el=document.getElementById("f-address")) && !place.placeId) place.address = el.value;
  if((el=document.getElementById("f-website"))) place.website = el.value;
  if((el=document.getElementById("f-hh-menu"))) place.happyHourMenuUrl = el.value;
  if((el=document.getElementById("f-source"))) place.source = el.value;
  if((el=document.getElementById("f-notes"))) place.notes = el.value;
  if(place.happyHour && place.happyHour.days){
    DAYS_OF_WEEK.forEach(function(d){
      var day = place.happyHour.days[d.key];
      var s, e;
      if((s=document.getElementById("hh-start-"+d.key))) day.start = s.value;
      if((e=document.getElementById("hh-end-"+d.key))) day.end = e.value;
    });
  }
}
function preserveSheetInput(){
  if(!S.sheet || !S.sheet.place) return;
  syncSheetFieldsIntoPlace(S.sheet.place);
  if(S.sheet.reviewDraft) syncReviewFieldsIntoDraft();
}
function closeSheet(){ S.sheet=null; S.confirmDeleteId=null; S.confirmDeleteReviewId=null; render(); }
function persistPlaceQuiet(place, successMsg){
  var data = Object.assign({}, place);
  var id = data.id; delete data.id; delete data.isNew;
  return store.savePlace(S.spaceCode, id, data).then(function(){
    place.isNew = false;
    if(successMsg) showToast(successMsg);
    render();
  }).catch(function(){ showToast("Couldn't save — try again"); render(); });
}

/* ---------------- Review sub-sheet ---------------- */
function openReviewDraft(existing, mode){
  if(existing){ S.sheet.reviewDraft = Object.assign({}, existing); S.sheet.reviewEditingId = existing.id; }
  else { S.sheet.reviewDraft = blankReview(); S.sheet.reviewEditingId = null; }
  S.sheet.originalReview = Object.assign({}, S.sheet.reviewDraft);
  S.sheet.reviewMode = mode || (existing ? "view" : "edit");
  S.sheet.reviewSetCover = false;
}
function closeReviewDraft(){ S.sheet.reviewDraft=null; S.sheet.reviewEditingId=null; S.sheet.reviewSetCover=false; render(); }
function syncReviewFieldsIntoDraft(){
  var r = S.sheet && S.sheet.reviewDraft; if(!r) return;
  var el;
  if((el=document.getElementById("rv-dishes"))) r.dishesLiked = el.value;
  if((el=document.getElementById("rv-comments"))) r.comments = el.value;
  if((el=document.getElementById("rv-date"))) r.date = el.value;
}
function bindReviewSheet(place){
  var el;
  var r = S.sheet.reviewDraft;
  var overlay = document.getElementById("review-overlay");
  if(overlay) overlay.onclick = function(e){ if(e.target===overlay) closeReviewDraft(); };
  if((el=document.getElementById("review-close"))) el.onclick = closeReviewDraft;
  if((el=document.getElementById("review-cancel"))) el.onclick = function(){
    if(!S.sheet.reviewEditingId){ closeReviewDraft(); return; }
    S.sheet.reviewDraft = Object.assign({}, S.sheet.originalReview);
    S.sheet.reviewMode = "view";
    render();
  };
  if((el=document.getElementById("review-edit-btn"))) el.onclick = function(){ S.sheet.reviewMode = "edit"; render(); };
  document.querySelectorAll("[data-review-for]").forEach(function(b){
    b.onclick = function(){ syncReviewFieldsIntoDraft(); r.uid = b.getAttribute("data-review-for"); render(); };
  });
  document.querySelectorAll("[data-review-star]").forEach(function(b){
    b.onclick = function(){
      var i = +b.getAttribute("data-review-star");
      var next = r.rating===i ? i-0.5 : (r.rating===i-0.5 ? 0 : i);
      syncReviewFieldsIntoDraft(); r.rating = next; render();
    };
  });
  document.querySelectorAll("[data-review-return]").forEach(function(b){
    b.onclick = function(){ syncReviewFieldsIntoDraft(); r.wouldReturn = b.getAttribute("data-review-return"); render(); };
  });
  if((el=document.getElementById("review-photo-add-btn"))) el.onclick = function(){ document.getElementById("review-photo-file").click(); };
  if((el=document.getElementById("review-photo-file"))){
    el.onchange = function(){
      var file = this.files && this.files[0]; if(!file) return;
      showToast("Adding photo…");
      fileToCompressedDataUrl(file, 640, 0.55).then(function(dataUrl){
        if(!photoFits(place, dataUrl)){ showToast("This place is out of photo room — remove an older photo first"); return; }
        syncReviewFieldsIntoDraft(); r.photo = dataUrl; render();
      }).catch(function(){ showToast("Couldn't add that photo"); });
    };
  }
  document.querySelectorAll("[data-review-photo-del]").forEach(function(b){
    b.onclick = function(){ syncReviewFieldsIntoDraft(); r.photo = null; S.sheet.reviewSetCover=false; render(); };
  });
  if((el=document.getElementById("rv-set-cover"))){
    el.onchange = function(){ S.sheet.reviewSetCover = this.checked; };
  }
  if((el=document.getElementById("review-save"))){
    el.onclick = function(){
      syncReviewFieldsIntoDraft();
      var reviews = (place.reviews||[]).slice();
      var idx = reviews.findIndex(function(x){return x.id===r.id;});
      if(idx>-1) reviews[idx]=r; else reviews.push(r);
      place.reviews = reviews;
      if(place.status==="want") place.status = "been";
      if(S.sheet.reviewSetCover && r.photo) place.coverPhoto = r.photo;
      syncSheetFieldsIntoPlace(place);
      S.sheet.reviewDraft = null; S.sheet.reviewEditingId = null; S.sheet.reviewSetCover = false;
      // A place that hasn't been saved yet keeps the review in its draft;
      // otherwise an unnamed "Untitled" place would get written the moment a
      // review is added to it.
      if(place.isNew){ render(); showToast("Review added — tap Save to keep this place"); return; }
      persistPlaceQuiet(place, "Review saved");
    };
  }
}

/* ---------------- Boot ---------------- */
onAuthStateChanged(auth, function(user){
  S.authChecked = true; S.authBusy = false;
  if(!user){ S.authUser=null; S.meUid=null; S.me=null; render(); return; }
  S.authUser = user; S.meUid = user.uid;
  store.getUserProfile(user.uid).then(function(profile){
    if(profile && profile.displayName){
      S.me = profile.displayName; S.needsName = false;
      var last = loadLocalSpace();
      if(last && !S.spaceCode) enterSpace(last); else render();
    } else {
      S.needsName = true; render();
    }
  }).catch(function(){ S.needsName = true; render(); });
});

render();

setInterval(function(){
  if(S.sheet || S.filterSheet || S.exportPicker || S.exporting) return;
  var ae = document.activeElement;
  if(ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.tagName==="SELECT")) return;
  if(S.tab==="been" || S.tab==="want") render();
}, 60000);

if('serviceWorker' in navigator){
  // updateViaCache:'none' bypasses GitHub Pages' Cache-Control: max-age=600
  // when checking sw.js for changes; reg.update() forces an immediate
  // check; auto-reload on controllerchange applies an update as soon as
  // it activates, instead of requiring a manual reopen.
  // Reload only when an *existing* worker is replaced: on the very first
  // visit clients.claim() also fires controllerchange, and reloading a page
  // the person just opened is a visible flash for nothing.
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
    reg.update();
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (reloaded || !hadController) return;
      reloaded = true;
      location.reload();
    });
  }).catch(function(){});
}

if(window.matchMedia){ try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ applyTheme(currentTheme()); }); }catch(e){} }
applyTheme(currentTheme());
window.addEventListener('beforeprint', clearExportingState);
window.addEventListener('afterprint', function(){
  clearExportingState();
  var pa = document.getElementById('print-area');
  if(pa) pa.innerHTML = "";
});
