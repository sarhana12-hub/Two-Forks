<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Forks</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF8F2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.ico">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  color-scheme: light dark;
  --bg: #FBF8F2;
  --surface: #FFFFFF;
  --surface-2: #F1EAD9;
  --ink: #241F1B;
  --ink-soft: #6B6259;
  --ink-faint: #756C60;
  --accent: #1F6F5C;
  --accent-strong: #164F41;
  --accent-ink: #FFFFFF;
  --gold: #96691E;
  --gold-soft: #F3E3BE;
  --chili: #B23A26;
  --chili-soft: #F6DED7;
  --border: #E7DFCF;
  --shadow: 0 8px 24px rgba(36,31,27,0.08);
  --shadow-lift: 0 14px 32px rgba(36,31,27,0.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #16130F; --surface: #201B15; --surface-2: #28221A; --ink: #F3EDE2; --ink-soft: #B7AC9C; --ink-faint: #918573;
    --accent: #4FBFA0; --accent-strong: #6ED4B7; --accent-ink: #0E1512; --gold: #E8BB63; --gold-soft: #3A2F1B;
    --chili: #E2705C; --chili-soft: #3A211B; --border: #362F24;
    --shadow: 0 8px 24px rgba(0,0,0,0.35); --shadow-lift: 0 14px 36px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg: #16130F; --surface: #201B15; --surface-2: #28221A; --ink: #F3EDE2; --ink-soft: #B7AC9C; --ink-faint: #918573;
  --accent: #4FBFA0; --accent-strong: #6ED4B7; --accent-ink: #0E1512; --gold: #E8BB63; --gold-soft: #3A2F1B;
  --chili: #E2705C; --chili-soft: #3A211B; --border: #362F24;
  --shadow: 0 8px 24px rgba(0,0,0,0.35); --shadow-lift: 0 14px 36px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--ink);
  font-family: 'Work Sans', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
img{ max-width:100%; }
[hidden]{ display:none!important; }
#app{ min-height:100vh; display:flex; justify-content:center; }
.shell{
  width:100%; max-width:480px; min-height:100vh;
  background:var(--bg);
  display:flex; flex-direction:column;
  position:relative;
  box-shadow: var(--shadow);
}
@media (min-width:520px){
  body{ background:
    radial-gradient(1200px 800px at 15% -10%, var(--surface-2), transparent 60%),
    var(--bg); }
  .shell{ margin-block:24px; border-radius:20px; overflow:hidden; min-height:calc(100vh - 48px); }
}

h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; }
.mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
a{ color:var(--accent); }

/* ---------- Onboarding / Auth ---------- */
.onboard{ flex:1; display:flex; flex-direction:column; padding:28px 24px calc(28px + env(safe-area-inset-bottom)); }
.onboard-hero{ margin-top:8vh; margin-bottom:32px; }
.onboard-hero .fork{ font-size:40px; line-height:1; margin-bottom:14px; }
.onboard-hero h1{ font-size:30px; font-weight:600; margin:0 0 10px; color:var(--ink); }
.onboard-hero p{ color:var(--ink-soft); font-size:15.5px; line-height:1.5; margin:0; max-width:34ch; }
.onboard-actions{ display:flex; flex-direction:column; gap:12px; margin-top:auto; }
.card-panel{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
input[type=text], input[type=date], input[type=search], input[type=email], input[type=password], select, textarea{
  font:inherit; font-size:16px; padding:11px 13px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink); width:100%;
}
input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
textarea{ resize:vertical; min-height:70px; font-family:inherit; }

.btn{ font:inherit; font-size:15.5px; font-weight:600; border-radius:12px; border:1px solid transparent;
  padding:13px 18px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-primary:active{ background:var(--accent-strong); }
.btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--border); }
.btn-ghost{ background:transparent; color:var(--accent); border-color:transparent; padding:8px 4px; }
.btn-danger{ background:transparent; color:var(--chili); border:1px solid var(--chili-soft); }
.btn-block{ width:100%; }
.btn:disabled{ opacity:.5; cursor:default; }
.btn-sm{ padding:8px 12px; font-size:14px; border-radius:9px; }

.link-row{ text-align:center; margin-top:6px; }
.link-btn{ background:none; border:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; font-size:14px; }

.back-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.icon-btn{ width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex:none; }

.divider{ display:flex; align-items:center; gap:12px; color:var(--ink-faint); font-size:12.5px; margin:16px 0; }
.divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--border); }

.error-text{ color:var(--chili); font-size:12.5px; margin:-6px 0 12px; line-height:1.4; }
.err-box{ background:var(--chili-soft); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:14px; }

/* ---------- App shell ---------- */
.header{ position:sticky; top:0; z-index:5; background:var(--bg); padding:16px 18px 10px; display:flex; flex-direction:column; gap:12px; }
.header-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand{ display:flex; align-items:center; gap:8px; }
.brand .fork{ font-size:18px; }
.brand span{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; }
.people-row{ display:flex; align-items:center; }
.avatar{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff; border:2px solid var(--bg); margin-left:-8px; }
.avatar:first-child{ margin-left:0; }
.sync-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
.sync-note{ font-size:11px; color:var(--ink-faint); display:flex; align-items:center; }

.search-wrap{ position:relative; }
.search-wrap input{ padding-left:36px; background:var(--surface-2); border-color:transparent; }
.search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.55; }

.tabs-title{ font-size:26px; font-weight:600; margin:0; }

.chip-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 18px 4px; margin:0 -18px; scrollbar-width:none; align-self:stretch; max-width:100%; }
.chip-row::-webkit-scrollbar{ display:none; }
.chip{ flex:none; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
  font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
.chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.hh-filter-toggle{ display:inline-flex; align-items:center; gap:6px; margin:8px 0 2px; padding:7px 14px; border-radius:999px;
  border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
.hh-filter-toggle.active{ background:var(--chili); border-color:var(--chili); color:var(--accent-ink); }

.content{ flex:1; padding:14px 18px calc(96px + env(safe-area-inset-bottom)); overflow-y:auto; }

.section-heading{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
  margin:20px 0 10px; }
.section-heading:first-child{ margin-top:4px; }

.empty{ text-align:center; padding:48px 20px; color:var(--ink-soft); }
.empty .fork{ font-size:34px; display:block; margin-bottom:10px; }
.empty p{ margin:0 0 16px; font-size:14px; line-height:1.5; }

.place-card{ display:flex; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px; margin-bottom:10px; cursor:pointer; align-items:flex-start; }
.place-card:active{ background:var(--surface-2); }
.place-card.hh-live{ border-color:var(--chili); box-shadow:0 0 0 1px var(--chili); background:var(--chili-soft); }
.place-thumb{ width:60px; height:60px; border-radius:10px; background:var(--surface-2); flex:none; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:22px; }
.place-thumb img{ width:100%; height:100%; object-fit:cover; }
.place-main{ flex:1; min-width:0; }
.place-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.place-name{ font-weight:600; font-size:15.5px; }
.price-tag{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--gold); font-weight:600; flex:none; }
.place-meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.dot-sep::before{ content:"·"; margin-right:6px; color:var(--ink-faint); }
.stars{ display:inline-flex; gap:1px; }
.stars svg{ width:13px; height:13px; }
.rating-line{ display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12.5px; color:var(--ink-soft); }
.rating-line b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }
.per-person{ font-size:11px; color:var(--ink-faint); }
.tag-row{ margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; }
.tag-pill{ font-size:11px; background:var(--surface-2); color:var(--ink-soft); padding:2px 8px; border-radius:999px; }
.tag-pill-live{ background:var(--chili); color:var(--accent-ink); font-weight:700; animation:hhPulse 2.4s ease-in-out infinite; }
@keyframes hhPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.7; } }
@media (prefers-reduced-motion: reduce){ .tag-pill-live{ animation:none; } }

.category-group{ margin-bottom:6px; }
.category-title{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:600; font-size:15.5px;
  margin:18px 0 8px; color:var(--ink); }
.category-title .count{ color:var(--ink-faint); font-weight:500; font-size:12.5px; }

.want-actions{ display:flex; gap:8px; margin-top:8px; }

.tabbar{ position:sticky; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
.tabbar button{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-faint); font:inherit; font-size:11px; font-weight:600; padding:6px 2px; cursor:pointer; }
.tabbar button.active{ color:var(--accent); }
.tabbar svg{ width:22px; height:22px; }

.fab{ position:fixed; z-index:7; right:calc(50% - 240px + 20px); bottom:calc(74px + env(safe-area-inset-bottom));
  width:54px; height:54px; border-radius:50%; background:var(--accent); color:var(--accent-ink); border:none;
  box-shadow:var(--shadow-lift); display:flex; align-items:center; justify-content:center; cursor:pointer; }
@media (max-width:519px){ .fab{ right:20px; } }
.fab svg{ width:24px; height:24px; }

.overlay{ position:fixed; inset:0; background:rgba(20,16,10,0.45); z-index:20; display:flex; justify-content:center; }
.sheet{ width:100%; max-width:480px; margin-top:auto; background:var(--bg); border-radius:20px 20px 0 0;
  max-height:92vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lift); }
@media (min-width:520px){ .overlay{ align-items:center; } .sheet{ margin-top:0; border-radius:18px; max-height:88vh; } }
.sheet-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); flex:none; }
.sheet-header h2{ font-size:18px; margin:0; font-weight:600; }
.sheet-body{ padding:16px 18px 8px; overflow-y:auto; flex:1; }
.sheet-footer{ padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); display:flex; gap:10px; flex:none; }

.segment{ display:flex; border:1px solid var(--border); border-radius:11px; overflow:hidden; }
.segment button{ flex:1; padding:10px; font:inherit; font-size:14px; font-weight:600; border:none; background:var(--surface); color:var(--ink-soft); cursor:pointer; }
.segment button.active{ background:var(--accent); color:var(--accent-ink); }
.segment button + button{ border-left:1px solid var(--border); }

.price-select{ display:flex; gap:8px; }
.price-select button{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink-soft); cursor:pointer; }
.price-select button.active{ background:var(--gold-soft); color:var(--gold); border-color:var(--gold); }

.cat-row{ display:flex; gap:8px; }
.cat-row select{ flex:1; }

.star-input{ display:flex; gap:4px; }
.star-input button{ background:none; border:none; padding:2px; cursor:pointer; }
.star-input svg{ width:30px; height:30px; }

.tag-input-row{ display:flex; gap:8px; }
.tag-input-row input{ flex:1; }
.chips-edit{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip-edit{ display:flex; align-items:center; gap:6px; background:var(--surface-2); padding:5px 6px 5px 12px; border-radius:999px; font-size:12.5px; }
.chip-edit button{ background:none; border:none; cursor:pointer; color:var(--ink-faint); display:flex; padding:2px; }

.photo-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.photo-thumb{ width:72px; height:72px; border-radius:10px; overflow:hidden; position:relative; background:var(--surface-2); }
.photo-thumb img{ width:100%; height:100%; object-fit:cover; }
.photo-thumb button{ position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:rgba(20,16,10,.65);
  color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.photo-add{ width:72px; height:72px; border-radius:10px; border:1.5px dashed var(--border); background:none; color:var(--ink-faint);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; cursor:pointer; }

.confirm-box{ background:var(--chili-soft); border:1px solid var(--chili); border-radius:12px; padding:14px; margin-top:12px; }
.confirm-box p{ margin:0 0 10px; font-size:14px; color:var(--ink); }
.confirm-box .row{ display:flex; gap:8px; }

.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); gap:12px; }
.settings-row:last-child{ border-bottom:none; }
.settings-row .label{ font-size:14px; font-weight:600; }
.settings-row .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

.code-display{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border-radius:12px;
  padding:14px 16px; }
.code-display .code{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; letter-spacing:.04em; }

.cat-manage-row{ display:flex; align-items:center; gap:8px; padding:8px 0; }
.cat-manage-row input{ flex:1; }
.cat-manage-row.dragging{ position:relative; z-index:5; background:var(--surface-2); border-radius:10px; }
.drag-handle{ background:none; border:none; padding:8px; margin:-8px; cursor:grab; touch-action:none; color:var(--ink-faint); flex:none; display:flex; align-items:center; justify-content:center; }

.shuffle-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:8px; }
.shuffle-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:26px 22px; width:100%; margin-top:18px; }
.shuffle-card .fork{ font-size:30px; }
.shuffle-card h3{ font-size:22px; margin:10px 0 4px; }
.shuffle-card .cat{ color:var(--ink-soft); font-size:14px; margin-bottom:12px; }

.toast{ position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600;
  z-index:30; box-shadow:var(--shadow-lift); max-width:88%; text-align:center; }

.helper-text{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 14px; }
.center-loading{ margin-top:30vh; text-align:center; }
.center-loading .fork{ font-size:40px; line-height:1; margin-bottom:14px; }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
  GoogleAuthProvider, signInWithPopup,
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  sendPasswordResetEmail, signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, onSnapshot, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxY-rwhNvTsREJ7IvM33I0PTNNk8gxWJw",
  authDomain: "two-forks-32e3d.firebaseapp.com",
  projectId: "two-forks-32e3d",
  storageBucket: "two-forks-32e3d.firebasestorage.app",
  messagingSenderId: "514216300410",
  appId: "1:514216300410:web:88aa6bfa4951e67e6f90c3"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const dbase = getFirestore(fbApp);
setPersistence(auth, browserLocalPersistence).catch(function(){});
try{ enableIndexedDbPersistence(dbase).catch(function(){}); }catch(e){}

var FOOD_WORDS = ["TACO","PLUM","MISO","LIME","SAGE","KALE","CORN","OKRA","BEAN","RICE","MINT","PEAR","FIGS","NUTS","EGGS","SOUP","STEW","CAKE","TART","BUNS","ROLL","CHAI","BREW","SALT","CRAB","CLAM","TUNA","DUCK","LAMB","PORK","SUSH","DILL","LEEK","YAMS","OATS","CURR","COCO","BASI","NAAN","PHOS"];
var CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
var DEFAULT_CATEGORIES = ["Burgers","Ice Cream","Indian","Pizza","Sushi","Tacos","Thai","Bars & Drinks","Coffee"];
var AVATAR_COLORS = ["#1F6F5C","#B23A26","#B9862C","#4A6FA5","#8654A3","#3E8E7E","#C1583F","#5C7A2E"];

function genCode(){
  var w = FOOD_WORDS[Math.floor(Math.random()*FOOD_WORDS.length)];
  var suffix = "";
  for(var i=0;i<3;i++) suffix += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return w + "-" + suffix;
}
function normCode(s){ return (s||"").trim().toUpperCase().replace(/[^A-Z0-9-]/g,""); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function hashStr(s){ var h=0; s=s||""; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function avatarColor(name){ return AVATAR_COLORS[hashStr(name||"?") % AVATAR_COLORS.length]; }
function initials(name){ name=(name||"?").trim(); if(!name) return "?"; var parts=name.split(/\s+/); return (parts[0][0]+(parts[1]?parts[1][0]:"")).toUpperCase(); }
function mapsUrl(name,address){ var q=[name,address].filter(Boolean).join(" "); return "https://maps.apple.com/?daddr="+encodeURIComponent(q); }
function webSearchUrl(name,address){ var q=[name,address,"menu"].filter(Boolean).join(" "); return "https://www.google.com/search?q="+encodeURIComponent(q); }
function faviconUrl(website){
  try{ var host = new URL(website).hostname; return "https://www.google.com/s2/favicons?domain="+encodeURIComponent(host)+"&sz=32"; }
  catch(e){ return null; }
}

function starSvg(fill){

function avgRating(reviews){
  if(!reviews || !reviews.length) return null;
  var vals = reviews.map(function(r){return r.rating;}).filter(function(v){ return typeof v==="number" && v>0; });
  if(!vals.length) return null;

}

var DAYS_OF_WEEK = [
  {key:"mon",label:"Mon"},{key:"tue",label:"Tue"},{key:"wed",label:"Wed"},{key:"thu",label:"Thu"},
  {key:"fri",label:"Fri"},{key:"sat",label:"Sat"},{key:"sun",label:"Sun"}
];
function getHappyHour(p){
  var hh = p.happyHour || {};
  var days = {};
  DAYS_OF_WEEK.forEach(function(d){
    var existing = (hh.days && hh.days[d.key]) || {};
    days[d.key] = { active: !!existing.active, start: existing.start||"", end: existing.end||"" };
  });
  return { enabled: !!hh.enabled, days: days };
}
function formatTime12h(t){
  if(!t) return "";
  var parts = t.split(":"); var h = +parts[0], m = parts[1];
  var ampm = h>=12 ? "PM" : "AM";
  var h12 = h%12; if(h12===0) h12=12;
  return h12+":"+m+" "+ampm;
}
var JS_DAY_KEYS = ["sun","mon","tue","wed","thu","fri","sat"];
function timeToMin(t){ var parts=(t||"").split(":"); return (+parts[0])*60+(+parts[1]); }
function isHappyHourNow(p, now){
  var hh = getHappyHour(p);
  if(!hh.enabled) return false;
  now = now || new Date();
  var nowMin = now.getHours()*60 + now.getMinutes();
  function spans(day, min){
    if(!day || !day.active || !day.start || !day.end) return false;
    var s = timeToMin(day.start), e = timeToMin(day.end);
    if(e<=s) return min>=s || min<e;
    return min>=s && min<e;
  }
  if(spans(hh.days[JS_DAY_KEYS[now.getDay()]], nowMin)) return true;
  var yesterday = hh.days[JS_DAY_KEYS[(now.getDay()+6)%7]];
  if(yesterday && yesterday.active && yesterday.start && yesterday.end){
    var s = timeToMin(yesterday.start), e = timeToMin(yesterday.end);
    if(e<=s && nowMin<e) return true;
  }
  return false;
}

var store = {
  ensureSpace: function(code){
    var ref = doc(dbase, "spaces", code);
    return getDoc(ref).then(function(snap){
      if(snap.exists()) return snap.data();
      var fresh = { categories: DEFAULT_CATEGORIES.slice(), people: [], createdAt: new Date().toISOString() };
      return setDoc(ref, fresh).then(function(){ return fresh; });
    });
  },
  updateSpace: function(code, patch){ return updateDoc(doc(dbase,"spaces",code), patch); },
  subscribeSpace: function(code, cb){
    return onSnapshot(doc(dbase,"spaces",code), function(snap){ if(snap.exists()) cb(snap.data()); }, function(){});
  },
  subscribePlaces: function(code, cb){
    return onSnapshot(collection(dbase,"spaces",code,"places"), function(snap){
      cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
    }, function(){});
  },
  savePlace: function(code, id, data){ return setDoc(doc(dbase,"spaces",code,"places",id), data); },
  deletePlace: function(code, id){ return deleteDoc(doc(dbase,"spaces",code,"places",id)); },
  getUserProfile: function(theUid){ return getDoc(doc(dbase,"users",theUid)).then(function(s){ return s.exists()?s.data():null; }); },
  saveUserProfile: function(theUid, data){ return setDoc(doc(dbase,"users",theUid), data, {merge:true}); }
};

function fileToCompressedDataUrl(file, maxDim, quality){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w=img.width, h=img.height;
        if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        var canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ reject(new Error("Couldn't read that image")); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error("Couldn't read that file")); };
    reader.readAsDataURL(file);
  });
}

function enterSpace(code){
  S.spaceCode = code; S.loadingSpace = true; persistSpace();
  teardownSubs();
  render();
  store.ensureSpace(code).then(function(space){
    S.space = space; S.loadingSpace = false;
    var already = (space.people||[]).some(function(p){ return p.uid===S.meUid; });
    if(!already){
      var people = (space.people||[]).concat([{uid:S.meUid, name:S.me}]);
      store.updateSpace(code, {people: people});
    }
    unsubs.push(store.subscribeSpace(code, function(sp){ S.space = sp; preserveSheetInput(); render(); }));
    unsubs.push(store.subscribePlaces(code, function(pl){ S.places = pl; preserveSheetInput(); render(); }));
    render();
  }).catch(function(err){
    S.loadingSpace = false; S.spaceCode = null; forgetLocalSpace();
    showToast("Couldn't open that list — check the code and try again");
  });
}

/* ---------------- Shell ---------------- */
function shellHtml(){
  var html = '<div class="shell">';
  html += headerHtml();
  html += '<div class="content" id="content">'+tabContentHtml()+'</div>';
  if(S.tab==="been" || S.tab==="want") html += '<button class="fab" id="fab-add" aria-label="Add place">'+iconPlus()+'</button>';
  html += tabbarHtml();
  html += '</div>';
  if(S.sheet) html += sheetHtml();
  if(S.sheet && S.sheet.reviewDraft) html += reviewSheetHtml();
  if(S.toast) html += '<div class="toast">'+escapeHtml(S.toast)+'</div>';
  return html;
}
function headerHtml(){
  var title = {been:"Been There", want:"Want to Go", shuffle:"Surprise Me", settings:"Settings"}[S.tab];
  var people = S.space.people || [];
  var avatars = people.slice(0,4).map(function(p){
    return '<div class="avatar" style="background:'+avatarColor(p.name)+'" title="'+escapeHtml(p.name)+'">'+initials(p.name)+'</div>';
  }).join("");
  var html = '<div class="header">';
  html += '<div class="header-row"><div class="brand"><span class="fork">'+iconTwoForks()+'</span><span>Two Forks</span></div><div class="people-row">'+avatars+'</div></div>';
  html += '<div class="header-row"><h1 class="tabs-title display">'+title+'</h1>'+
    '<span class="sync-note"><span class="sync-dot" style="background:var(--accent)"></span>Synced</span></div>';
  if(S.tab==="been" || S.tab==="want"){
    html += '<div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+
      '<input type="search" id="search-input" placeholder="Search places, tags, notes" value="'+escapeHtml(S.search)+'"></div>';
    html += categoryChipsHtml();
    html += happyHourFilterHtml();
  }
  html += '</div>';
  return html;
}
function happyHourFilterHtml(){
  var active = !!S.happyHourNow;
  return '<button type="button" class="hh-filter-toggle'+(active?" active":"")+'" data-hh-now-filter="1" aria-pressed="'+(active?"true":"false")+'">🍹 Happy hour right now</button>';
}
function categoryChipsHtml(){
  var cats = S.space.categories||[];
  var html = '<div class="chip-row"><button class="chip'+(S.categoryFilter?"":" active")+'" data-cat="">All</button>';
  cats.forEach(function(c){ html += '<button class="chip'+(S.categoryFilter===c?" active":"")+'" data-cat="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>'; });
  html += '</div>';
  return html;
}
function filteredPlaces(status){
  var q = (S.search||"").toLowerCase().trim();
  return S.places.filter(function(p){
    if((p.status||"want")!==status) return false;
    if(S.categoryFilter && getCategories(p).indexOf(S.categoryFilter)===-1) return false;
    if(S.happyHourNow && !isHappyHourNow(p)) return false;
    if(q){
      var hay = [p.name,p.notes,p.source].concat(getCategories(p)).concat(p.tags||[]).join(" ").toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
}
function tabContentHtml(){
  if(S.tab==="been") return beenTabHtml();
  if(S.tab==="want") return wantTabHtml();
  if(S.tab==="shuffle") return shuffleTabHtml();
  if(S.tab==="settings") return settingsTabHtml();
  return "";
}
function placeCardHtml(p){
  var thumb = p.coverPhoto ? '<img src="'+p.coverPhoto+'" alt="">' : defaultCoverEmoji(p);
  var reviews = p.reviews||[];
  var avg = avgRating(reviews);
  var priceStr = p.price ? Array(p.price+1).join("$") : "";
  var metaBits = [];
  var placeCats = getCategories(p);
  if(placeCats.length) metaBits.push(escapeHtml(placeCats.join(", ")));
  if(p.neighborhood) metaBits.push(escapeHtml(p.neighborhood));
  else if(p.address) metaBits.push(escapeHtml(p.address));
  if(p.website){
    var fav = faviconUrl(p.website);
    metaBits.push('<a href="'+escapeHtml(p.website)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;">'+
      (fav?'<img src="'+fav+'" alt="" width="14" height="14" style="border-radius:3px;">':'')+'Menu ↗</a>');
  }
  var cardHH = getHappyHour(p);
  var hasHappyHour = cardHH.enabled && DAYS_OF_WEEK.some(function(d){ return cardHH.days[d.key].active; });
  var hhLiveNow = hasHappyHour && isHappyHourNow(p);
  var html = '<div class="place-card'+(hhLiveNow?" hh-live":"")+'" data-id="'+p.id+'">';
  html += '<div class="place-thumb">'+thumb+'</div><div class="place-main">';
  html += '<div class="place-top"><div class="place-name">'+escapeHtml(p.name)+'</div>'+(priceStr?'<div class="price-tag">'+priceStr+'</div>':'')+'</div>';
  html += '<div class="place-meta">'+metaBits.map(function(m,i){return (i>0?'<span class="dot-sep"></span>':'')+m;}).join("")+'</div>';
  if(avg!=null){
    var countStr = reviews.length===1 ? "1 review" : reviews.length+" reviews";
    var per = perPersonAverages(reviews).map(function(pp){ return escapeHtml(pp.name)+" "+pp.avg.toFixed(1); }).join(" · ");
    html += '<div class="rating-line">'+starsHtml(avg)+'<b>'+avg.toFixed(1)+'</b><span class="per-person">'+escapeHtml(countStr)+(per?" · "+per:"")+'</span></div>';
  }
  if((p.status||"want")==="want"){
    if(p.notes) html += '<div class="per-person" style="margin-top:6px;"><b style="color:var(--ink);">Want to try:</b> '+escapeHtml(p.notes)+'</div>';
    if(p.source) html += '<div class="per-person" style="margin-top:2px;"><b style="color:var(--ink);">Source:</b> '+escapeHtml(p.source)+'</div>';
  }
  if(hasHappyHour || (p.tags && p.tags.length)){
    html += '<div class="tag-row">'+
      (hhLiveNow ? '<span class="tag-pill tag-pill-live">🎉 Happy Hour now</span>' : (hasHappyHour ? '<span class="tag-pill">🍹 Happy Hour</span>' : ''))+
      (p.tags||[]).map(function(t){return '<span class="tag-pill">'+escapeHtml(t)+'</span>';}).join("")+
      '</div>';
  }
  if((p.status||"want")==="want") html += '<div class="want-actions"><button class="btn btn-secondary btn-sm" data-mark-been="'+p.id+'">'+iconCheckboxQuestion()+' Been here?</button></div>';
  html += '</div></div>';
  return html;
}
var CATEGORY_EMOJI_SETS = {
  "tacos": ["🌮","🫔","🌯"],
  "pizza": ["🍕","🧀"],
  "coffee": ["☕","🫘","🥐"],
  "brunch": ["🥞","🍳"],
  "burgers": ["🍔","🍟"],
  "ramen": ["🍜","🍲"],
  "ice cream": ["🍨","🍦","🍧"],
  "bars & drinks": ["🍸","🍹","🍺"],
  "sushi": ["🍣","🍱","🍙"],
  "indian": ["🍛","🍚"],
  "thai": ["🍜","🍲"]
};
var DEFAULT_EMOJI_SET = ["🍽️","🍴","🥢"];
function categoryEmojiSet(cat){
  return CATEGORY_EMOJI_SETS[(cat||"").trim().toLowerCase()] || DEFAULT_EMOJI_SET;
}
function categoryEmoji(cat){ return categoryEmojiSet(cat)[0]; }
function defaultCoverEmoji(p){
  var cats = getCategories(p);
  var set = categoryEmojiSet(cats[0]);
  return set[hashStr(p.id||p.name||"") % set.length];
}
function categoryRank(name){
  var idx = (S.space.categories||[]).indexOf(name);
  return idx===-1 ? 9999 : idx;
}
function emptyStateHtml(kind){
  var emoji = S.categoryFilter ? categoryEmoji(S.categoryFilter) : (kind==="been" ? "🌮" : "📍");
  if(S.happyHourNow){
    return '<div class="empty"><span class="fork">🍹</span><p>No spots have happy hour going on right now. Check back later, or turn off "Happy hour right now" above.</p></div>';
  }
  if(S.search){
    return '<div class="empty"><span class="fork">'+emoji+'</span><p>Nothing matches “'+escapeHtml(S.search)+'”'+(S.categoryFilter?' in '+escapeHtml(S.categoryFilter):'')+'. Try a different search, or tap + to add it.</p></div>';
  }
  if(S.categoryFilter){
    var verb = kind==="been" ? "logged" : "on your want-to-go list";
    return '<div class="empty"><span class="fork">'+emoji+'</span><p>No '+escapeHtml(S.categoryFilter)+' spots '+verb+' yet. Tap + to add one, or pick "All" above to see everything else.</p></div>';
  }
  if(kind==="been") return '<div class="empty"><span class="fork">🍽️</span><p>No places yet. Tap + to log the first spot you\'ve tried.</p></div>';
  return '<div class="empty"><span class="fork">📍</span><p>Nothing on your list to try yet. Add a place you have been wanting to check out.</p></div>';
}
function beenTabHtml(){
  var list = filteredPlaces("been");
  if(S.sortBeen==="top") list = list.slice().sort(function(a,b){ return (avgRating(b.reviews)||0)-(avgRating(a.reviews)||0); });
  else if(S.sortBeen==="recent") list = list.slice().sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
  else list = list.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  if(!list.length) return emptyStateHtml("been");
  var html = '<div class="chip-row" style="margin-bottom:6px;">'+["top","recent","name"].map(function(s){
    var label = {top:"Highest rated",recent:"Recently added",name:"Name A–Z"}[s];
    return '<button class="chip'+(S.sortBeen===s?" active":"")+'" data-sort="'+s+'">'+label+'</button>';
  }).join("")+'</div>';
  html += list.map(placeCardHtml).join("");
  return html;
}
function wantTabHtml(){
  var list = filteredPlaces("want");
  if(!list.length) return emptyStateHtml("want");
  if(S.categoryFilter) return list.sort(function(a,b){return a.name.localeCompare(b.name);}).map(placeCardHtml).join("");
  var byCat = {};
  list.forEach(function(p){
    var cs = getCategories(p); if(!cs.length) cs=["Uncategorized"];
    cs.forEach(function(c){ (byCat[c]=byCat[c]||[]).push(p); });
  });
  return Object.keys(byCat).sort(function(a,b){ return categoryRank(a)-categoryRank(b); }).map(function(c){
    var items = byCat[c].sort(function(a,b){return a.name.localeCompare(b.name);});
    return '<div class="category-group"><div class="category-title">'+escapeHtml(c)+' <span class="count">'+items.length+'</span></div>'+items.map(placeCardHtml).join("")+'</div>';
  }).join("");
}
function shuffleTabHtml(){
  var cats = S.space.categories||[];
  var html = '<div class="shuffle-wrap">';
  html += '<div class="segment"><button class="'+(S.shuffleMode==="new"?"active":"")+'" data-shuffle-mode="new">Somewhere new</button>'+
    '<button class="'+(S.shuffleMode==="favorite"?"active":"")+'" data-shuffle-mode="favorite">Go-to favorite</button></div>';
  html += '<div class="chip-row" style="margin-top:12px;"><button class="chip'+(!S.shuffleCategory?" active":"")+'" data-shuffle-cat="">Any category</button>'+
    cats.map(function(c){ return '<button class="chip'+(S.shuffleCategory===c?" active":"")+'" data-shuffle-cat="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>'; }).join("")+'</div>';
  if(S.shuffleResult){
    var p = S.shuffleResult; var avg = avgRating(p.reviews);

      '<h3 class="display">'+escapeHtml(p.name)+'</h3><div class="cat">'+escapeHtml(getCategories(p).join(", "))+((p.neighborhood||p.address)?" · "+escapeHtml(p.neighborhood||p.address):"")+'</div>'+
      (avg!=null?('<div class="rating-line" style="justify-content:center;">'+starsHtml(avg)+'<b>'+avg.toFixed(1)+'</b></div>'):"")+
      '<div style="display:flex;gap:10px;margin-top:16px;"><button class="btn btn-secondary btn-block" id="shuffle-view">View details</button>'+
      '<button class="btn btn-primary btn-block" id="shuffle-again">Shuffle again</button></div></div>';
  } else {
    html += '<button class="btn btn-primary" style="margin-top:20px;" id="shuffle-go">'+iconDice()+' Pick for me</button>';
  }
  html += '</div>';
  return html;
}

  html += '<div class="settings-row"><div><div class="label">Switch lists</div><div class="sub">Go back to choosing a list</div></div><button class="btn btn-secondary btn-sm" id="switch-list">Switch</button></div>';
  html += '<div class="settings-row"><div><div class="label">Sign out</div><div class="sub">On this device</div></div><button class="btn btn-danger btn-sm" id="sign-out-btn">Sign out</button></div>';
  html += '</div>';

  html += '<div class="card-panel">';
  html += '<div class="section-heading" style="margin-top:0;">Categories</div>';
  html += '<p class="helper-text" style="margin-top:-4px;">Drag the handle to reorder.</p>';

    html += '<div class="cat-manage-row" data-cat-name="'+escapeHtml(c)+'">'+

function tabbarHtml(){
  function item(key,label,icon){ return '<button class="'+(S.tab===key?"active":"")+'" data-tab="'+key+'">'+icon+'<span>'+label+'</span></button>'; }
  return '<div class="tabbar">'+item("been","Been There",iconBookmark())+item("want","Want to Go",iconMap())+item("shuffle","Surprise",iconDice())+item("settings","Settings",iconGear())+'</div>';
}

/* ---------------- Sheet ---------------- */
var NEIGHBORHOODS = ["Downtown","Eat Street","Mill District","North Loop","Northeast","Uptown","St. Paul","New Haven","Other"];
function blankPlace(status, category){
  return { id: uid(), name:"", categories: category ? [category] : [], status: status||"want", address:"", neighborhood:"", website:"",
    price:0, notes:"", source:"", tags:[], coverPhoto:null, reviews:[], addedBy:S.meUid, createdAt: new Date().toISOString(), isNew:true };
}
function blankReview(){
  return { id: uid(), uid: S.meUid, rating:0, dishesLiked:"", comments:"", date: new Date().toISOString().slice(0,10), wouldReturn:null, photo:null, createdAt: new Date().toISOString() };
}
function openPlaceSheet(place, mode){
  S.sheet = {type:"edit", place: Object.assign({}, place)};
  S.sheet.originalPlace = Object.assign({}, S.sheet.place);
  S.sheet.mode = mode || (place.isNew ? "edit" : "view");
}
function normalizeUrl(u){
  u = (u||"").trim();
  if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://"+u;
  return u;
}
function sheetHtml(){
  if(S.sheet.type!=="edit") return "";
  return S.sheet.mode==="edit" ? editSheetHtml(S.sheet.place) : placeViewHtml(S.sheet.place);
}
function placeViewHtml(p){
  var placeCats = getCategories(p);
  var reviews = (p.reviews||[]).slice().sort(function(a,b){ return (b.date||b.createdAt||"").localeCompare(a.date||a.createdAt||""); });
  var avg = avgRating(p.reviews);
  var priceStr = p.price ? Array(p.price+1).join("$") : "";
  var html = '<div class="overlay" id="sheet-overlay"><div class="sheet">';
  html += '<div class="sheet-header"><h2>'+escapeHtml(p.name||"Untitled")+'</h2><div style="display:flex;gap:8px;flex:none;">'+
    '<button class="icon-btn" id="sheet-edit-btn" aria-label="Edit">'+iconEdit()+'</button>'+
    '<button class="icon-btn" id="sheet-close" aria-label="Close">'+iconClose()+'</button>'+
    '</div></div>';
  html += '<div class="sheet-body">';
  if(p.coverPhoto){
    html += '<img src="'+p.coverPhoto+'" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;margin-bottom:14px;">';
  } else {
    html += '<div style="width:100%;aspect-ratio:16/10;border-radius:14px;margin-bottom:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:64px;">'+defaultCoverEmoji(p)+'</div>';
  }
  html += '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;">'+
    '<h2 class="display" style="font-size:26px;margin:0;line-height:1.15;">'+escapeHtml(p.name||"Untitled")+'</h2>'+
    (avg!=null?'<span class="mono" style="font-size:22px;font-weight:700;color:var(--gold);flex:none;">★ '+avg.toFixed(1)+'</span>':'')+
    '</div>';
  html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'+
    '<span class="chip active" style="cursor:default;">'+(p.status==="been"?"Been there":"Want to go")+'</span>'+
    (priceStr?'<span class="price-tag" style="font-size:14px;">'+priceStr+'</span>':'')+
    '</div>';
  if(placeCats.length || (p.tags&&p.tags.length)){
    html += '<div class="tag-row" style="margin-bottom:12px;">'+
      placeCats.map(function(c){return '<span class="tag-pill">'+escapeHtml(c)+'</span>';}).join("")+
      (p.tags||[]).map(function(t){return '<span class="tag-pill">'+escapeHtml(t)+'</span>';}).join("")+
      '</div>';
  }
  if(avg!=null){
    var countStr = reviews.length===1 ? "1 review" : reviews.length+" reviews";
    var per = perPersonAverages(p.reviews).map(function(pp){ return escapeHtml(pp.name)+" "+pp.avg.toFixed(1); }).join(" · ");
    html += '<div class="rating-line" style="margin-bottom:14px;">'+starsHtml(avg)+'<b>'+avg.toFixed(1)+'</b><span class="per-person">'+escapeHtml(countStr)+(per?" · "+per:"")+'</span></div>';
  }
  if(p.neighborhood || p.address){
    var locText = [p.neighborhood, p.address].filter(Boolean).join(" · ");
    html += '<div class="field"><label>Location</label><div style="font-size:14px;color:var(--ink);">'+escapeHtml(locText)+'</div></div>';
  }
  if(p.name && p.name.trim()){
    html += '<div class="field"><a href="'+mapsUrl(p.name,p.address||p.neighborhood)+'" target="_blank" rel="noopener" style="font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;">'+iconMap()+' Get Directions</a></div>';
  }
  if(p.website){

    html += '<div class="field"><label>Website</label><a href="'+escapeHtml(p.website)+'" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;">'+
      (siteFav?'<img src="'+siteFav+'" alt="" width="32" height="32" style="border-radius:8px;">':'')+
      '<span>Open website</span></a></div>';
  }
  if(p.source) html += '<div class="field"><label>Source</label><div style="font-size:14px;color:var(--ink-soft);">'+escapeHtml(p.source)+'</div></div>';
  if(p.notes) html += '<div class="field"><label>Notes</label><div style="font-size:14px;color:var(--ink-soft);white-space:pre-wrap;">'+escapeHtml(p.notes)+'</div></div>';
  var viewHH = getHappyHour(p);

    var hhDays = DAYS_OF_WEEK.filter(function(d){ return viewHH.days[d.key].active; });

        var day = viewHH.days[d.key];
        var range = (day.start&&day.end) ? (formatTime12h(day.start)+' – '+formatTime12h(day.end)) : 'Hours not set';
        var isToday = d.key===JS_DAY_KEYS[new Date().getDay()];
        return '<div style="font-size:14px;color:var(--ink-soft);'+(isToday?'font-weight:600;color:var(--ink);':'')+'"><b style="color:var(--ink);">'+d.label+':</b> '+escapeHtml(range)+'</div>';
      }).join("")+'</div>';
    }
  }
  html += '<div class="field"><label>Reviews'+(reviews.length?(' <span style="text-transform:none;font-weight:400;">('+reviews.length+')</span>'):'')+'</label>';

}

/* ---------------- Bindings ---------------- */
function bindShell(){
  var el;
  document.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick = function(){ S.tab=b.getAttribute("data-tab"); S.categoryFilter=null; S.search=""; S.shuffleResult=null; render(); }; });
  if((el=document.getElementById("fab-add"))) el.onclick = function(){ openPlaceSheet(blankPlace(S.tab==="been"?"been":"want", S.categoryFilter)); S.confirmDeleteId=null; S.confirmDeleteReviewId=null; render(); };
  document.querySelectorAll("[data-cat]").forEach(function(b){ b.onclick=function(){ S.categoryFilter=b.getAttribute("data-cat")||null; render(); }; });
  if((el=document.querySelector("[data-hh-now-filter]"))) el.onclick = function(){ S.happyHourNow = !S.happyHourNow; render(); };
  document.querySelectorAll("[data-sort]").forEach(function(b){ b.onclick=function(){ S.sortBeen=b.getAttribute("data-sort"); render(); }; });
  if((el=document.getElementById("search-input"))){
    el.oninput = function(){
      var pos = this.selectionStart; S.search = this.value; render();
      var el2 = document.getElementById("search-input");
      if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(e){} }
    };
  }
  document.querySelectorAll(".place-card").forEach(function(card){
    card.onclick = function(e){
      if(e.target.closest("[data-mark-been]")) return;
      if(e.target.closest("a")) return;
      var id = card.getAttribute("data-id");
      var p = S.places.filter(function(x){return x.id===id;})[0];
      if(p){ openPlaceSheet(p); S.confirmDeleteId=null; S.confirmDeleteReviewId=null; render(); }
    };
  });
  document.querySelectorAll("[data-mark-been]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var id = b.getAttribute("data-mark-been");
      var p = S.places.filter(function(x){return x.id===id;})[0];
      if(p){
        openPlaceSheet(p, "view");
        openReviewDraft(null);
        render();
      }
    };
  });
  document.querySelectorAll("[data-shuffle-mode]").forEach(function(b){ b.onclick=function(){ S.shuffleMode=b.getAttribute("data-shuffle-mode"); S.shuffleResult=null; render(); }; });
  document.querySelectorAll("[data-shuffle-cat]").forEach(function(b){ b.onclick=function(){ S.shuffleCategory=b.getAttribute("data-shuffle-cat")||null; S.shuffleResult=null; render(); }; });
  if((el=document.getElementById("shuffle-go"))) el.onclick = runShuffle;
  if((el=document.getElementById("shuffle-again"))) el.onclick = runShuffle;
  if((el=document.getElementById("shuffle-view"))) el.onclick = function(){ openPlaceSheet(S.shuffleResult); render(); };

  if((el=document.getElementById("copy-code"))) el.onclick = function(){
    var text = S.spaceCode;
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ showToast("Code copied"); }); }
    else { showToast("Your code: "+text); }
  };
  if((el=document.getElementById("copy-app-link"))) el.onclick = function(){
    var text = location.origin+location.pathname;
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ showToast("Link copied"); }); }
    else { showToast("Link: "+text); }
  };
  if((el=document.getElementById("rename-me"))) el.onclick = function(){
    var name = prompt("Your name", S.me);
    if(name && name.trim()){
      S.me = name.trim();
      store.saveUserProfile(S.meUid, {displayName:S.me});
      var people = (S.space.people||[]).slice();
      var idx = people.findIndex(function(p){return p.uid===S.meUid;});
      if(idx>-1) people[idx] = {uid:S.meUid, name:S.me}; else people.push({uid:S.meUid, name:S.me});
      store.updateSpace(S.spaceCode, {people: people});
      render();
    }
  };
  if((el=document.getElementById("switch-list"))) el.onclick = function(){ teardownSubs(); S.spaceCode=null; S.places=[]; render(); };
  if((el=document.getElementById("sign-out-btn"))) el.onclick = doSignOut;

  document.querySelectorAll("[data-cat-edit]").forEach(function(inp){
    inp.onchange = function(){
      var oldName = inp.getAttribute("data-cat-edit");
      var cats = (S.space.categories||[]).slice();
      var idx = cats.indexOf(oldName);
      if(idx===-1) return;
      var newName = inp.value.trim() || oldName;
      cats[idx] = newName;
      store.updateSpace(S.spaceCode, {categories: cats});
      if(newName!==oldName){
        S.places.filter(function(p){return getCategories(p).indexOf(oldName)>-1;}).forEach(function(p){
          var newCats = getCategories(p).map(function(c){ return c===oldName ? newName : c; });
          var data = Object.assign({}, p, {categories: newCats}); delete data.category; delete data.id;
          store.savePlace(S.spaceCode, p.id, data);
        });
      }
      render();
    };
  });
  document.querySelectorAll("[data-cat-del]").forEach(function(b){
    b.onclick = function(){
      var name = b.getAttribute("data-cat-del");
      var cats = (S.space.categories||[]).slice();
      var idx = cats.indexOf(name);
      if(idx>-1) cats.splice(idx,1);
      store.updateSpace(S.spaceCode, {categories: cats}); render();
    };
  });
  if((el=document.getElementById("new-cat-add"))) el.onclick = function(){
    var inp = document.getElementById("new-cat-input");
    var v = inp.value.trim(); if(!v) return;
    var cats = (S.space.categories||[]).slice();
    if(cats.indexOf(v)===-1) cats.push(v);
    store.updateSpace(S.spaceCode, {categories: cats});
    inp.value=""; render();
  };
  bindCategoryDrag();
  bindSheet();
}

function bindCategoryDrag(){
  var container = document.getElementById("cat-list");
  if(!container) return;
  var rows = Array.prototype.slice.call(container.querySelectorAll(".cat-manage-row"));
  if(rows.length < 2) return;
  var rowHeight = rows[0].getBoundingClientRect().height;
  rows.forEach(function(row, startIndex){
    var handle = row.querySelector(".drag-handle");
    if(!handle) return;
    handle.onpointerdown = function(e){
      e.preventDefault();
      var draggedName = row.getAttribute("data-cat-name");
      var startY = e.clientY;
      var currentTarget = startIndex;
      row.classList.add("dragging");
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      function applyShift(targetIdx){
        rows.forEach(function(r, i){
          if(r===row) return;
          var shift = 0;
          if(targetIdx > startIndex){ if(i > startIndex && i <= targetIdx) shift = -1; }
          else if(targetIdx < startIndex){ if(i >= targetIdx && i < startIndex) shift = 1; }
          r.style.transition = "transform 0.15s";
          r.style.transform = shift ? "translateY("+(shift*rowHeight)+"px)" : "";
        });
      }
      function onMove(ev){
        var deltaY = ev.clientY - startY;
        row.style.transform = "translateY("+deltaY+"px)";
        var offset = Math.round(deltaY / rowHeight);
        var targetIdx = Math.max(0, Math.min(rows.length-1, startIndex + offset));
        if(targetIdx !== currentTarget){
          currentTarget = targetIdx;
          applyShift(targetIdx);
        }
      }
      function onUp(){
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        rows.forEach(function(r){ r.style.transition=""; r.style.transform=""; r.classList.remove("dragging"); });
        if(currentTarget !== startIndex){
          var order = rows.map(function(r){ return r.getAttribute("data-cat-name"); });
          order.splice(startIndex,1);
          order.splice(currentTarget,0,draggedName);
          store.updateSpace(S.spaceCode, {categories: order});
        }
        render();
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp, {once:true});
    };
  });
}

function daysSinceLastVisit(p){
  var dates = (p.reviews||[]).map(function(r){ return r.date; }).filter(Boolean);
  if(!dates.length) return 3650; // no logged visit date - treat as long overdue
  var mostRecent = dates.reduce(function(a,b){ return a>b?a:b; });
  return Math.max(0, (Date.now() - new Date(mostRecent).getTime()) / 86400000);
}
function weightedRandomPick(pool, weightFn){
  var weights = pool.map(weightFn);
  var total = weights.reduce(function(a,b){ return a+b; }, 0);
  var r = Math.random() * total;
  for(var i=0;i<pool.length;i++){
    r -= weights[i];
    if(r<=0) return pool[i];
  }
  return pool[pool.length-1];
}
function runShuffle(){
  var pool = S.places.filter(function(p){
    if(S.shuffleCategory && getCategories(p).indexOf(S.shuffleCategory)===-1) return false;
    if(S.shuffleMode==="new") return (p.status||"want")==="want";
    if((p.status||"want")!=="been") return false;
    var avg = avgRating(p.reviews);
    return avg==null || avg>=4;
  });
  if(!pool.length){
    pool = S.places.filter(function(p){
      if(S.shuffleCategory && getCategories(p).indexOf(S.shuffleCategory)===-1) return false;
      return S.shuffleMode==="new" ? (p.status||"want")==="want" : (p.status||"want")==="been";
    });
  }
  if(!pool.length){ showToast("Nothing to pick from yet"); S.shuffleResult=null; render(); return; }
  var pick, guard=0;
  do {
    pick = S.shuffleMode==="favorite"
      ? weightedRandomPick(pool, function(p){ return 1 + Math.min(daysSinceLastVisit(p)/60, 3); })
      : pool[Math.floor(Math.random()*pool.length)];
    guard++;
  } while(pool.length>1 && S.shuffleResult && pick.id===S.shuffleResult.id && guard<20);
  S.shuffleResult = pick; render();
}

function bindSheet(){
  if(!S.sheet) return;
  var el;
  var overlay = document.getElementById("sheet-overlay");
  if(overlay) overlay.onclick = function(e){ if(e.target===overlay) closeSheet(); };
  if((el=document.getElementById("sheet-close"))) el.onclick = closeSheet;
  if((el=document.getElementById("sheet-cancel"))) el.onclick = function(){
    if(S.sheet.place.isNew){ closeSheet(); return; }
    S.sheet.place = Object.assign({}, S.sheet.originalPlace);
    S.sheet.mode = "view";
    render();
  };
  if((el=document.getElementById("sheet-edit-btn"))) el.onclick = function(){ S.sheet.mode = "edit"; render(); };
  var place = S.sheet.place;

  document.querySelectorAll("[data-set-status]").forEach(function(b){ b.onclick=function(){ place.status=b.getAttribute("data-set-status"); syncSheetFieldsIntoPlace(place); render(); }; });
  document.querySelectorAll("[data-price]").forEach(function(b){ b.onclick=function(){ var n=+b.getAttribute("data-price"); place.price = place.price===n?0:n; syncSheetFieldsIntoPlace(place); render(); }; });
  document.querySelectorAll("[data-hh-enabled]").forEach(function(b){
    b.onclick = function(){
      syncSheetFieldsIntoPlace(place);
      place.happyHour.enabled = b.getAttribute("data-hh-enabled")==="1";
      render();
    };
  });
  document.querySelectorAll("[data-hh-day-toggle]").forEach(function(b){
    b.onclick = function(){
      syncSheetFieldsIntoPlace(place);
      var key = b.getAttribute("data-hh-day-toggle");
      var day = place.happyHour.days[key];
      day.active = !day.active;
      if(day.active && !day.start && !day.end){
        var bs = (document.getElementById("hh-bulk-start")||{}).value;
        var be = (document.getElementById("hh-bulk-end")||{}).value;
        if(bs) day.start = bs;
        if(be) day.end = be;
      }
      render();
    };
  });
  if((el=document.getElementById("hh-apply-all"))){
    el.onclick = function(){
      syncSheetFieldsIntoPlace(place);
      var start = document.getElementById("hh-bulk-start").value;
      var end = document.getElementById("hh-bulk-end").value;
      DAYS_OF_WEEK.forEach(function(d){
        var day = place.happyHour.days[d.key];
        if(day.active){ day.start = start; day.end = end; }
      });
      render();
    };
  }
  document.querySelectorAll("[data-cat-toggle]").forEach(function(b){
    b.onclick = function(){
      var c = b.getAttribute("data-cat-toggle");
      var cats = getCategories(place).slice();
      var idx = cats.indexOf(c);
      if(idx>-1) cats.splice(idx,1); else cats.push(c);
      place.categories = cats; delete place.category;
      syncSheetFieldsIntoPlace(place); render();
    };
  });
  if((el=document.getElementById("cat-add-chip"))){
    el.onclick = function(){
      S.sheet.addingCategory = true;
      syncSheetFieldsIntoPlace(place); render();
      var inp = document.getElementById("f-new-cat");
      if(inp) inp.focus();
    };
  }
  if((el=document.getElementById("f-new-cat"))){
    el.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("f-cat-add").click(); } };
  }
  if((el=document.getElementById("f-cat-add"))){
    el.onclick = function(){
      var inp = document.getElementById("f-new-cat");
      var v = inp.value.trim(); if(!v) return;
      var spaceCats = (S.space.categories||[]).slice();
      if(spaceCats.indexOf(v)===-1){ spaceCats.push(v); store.updateSpace(S.spaceCode, {categories: spaceCats}); }
      var cats = getCategories(place).slice();
      if(cats.indexOf(v)===-1) cats.push(v);
      place.categories = cats; delete place.category;
      S.sheet.addingCategory = false;
      syncSheetFieldsIntoPlace(place); render();
    };
  }
  if((el=document.getElementById("website-search-btn"))){
    el.onclick = function(){
      var name = (document.getElementById("f-name")||{}).value || place.name || "";
      var hood = (document.getElementById("f-neighborhood")||{}).value || place.neighborhood || place.address || "";
      if(!name.trim()){ showToast("Add a name first"); return; }
      window.open(webSearchUrl(name, hood), "_blank", "noopener");
    };
  }
  if((el=document.getElementById("website-paste-btn"))){
    el.onclick = function(){
      if(!(navigator.clipboard && navigator.clipboard.readText)){ showToast("Clipboard paste isn't supported here — paste manually"); return; }
      navigator.clipboard.readText().then(function(text){
        text = (text||"").trim();
        if(!text){ showToast("Clipboard is empty"); return; }
        syncSheetFieldsIntoPlace(place);
        place.website = text;
        render();
        showToast("Pasted");
      }).catch(function(){ showToast("Couldn't read clipboard — paste manually"); });
    };
  }
  if((el=document.getElementById("f-tag-add"))){
    el.onclick = function(){
      var inp = document.getElementById("f-tag-input"); var v = inp.value.trim(); if(!v) return;
      place.tags = (place.tags||[]).concat([v]); syncSheetFieldsIntoPlace(place); render();
    };
  }
  document.querySelectorAll("[data-tag-del]").forEach(function(b){
    b.onclick = function(){ var i=+b.getAttribute("data-tag-del"); place.tags=(place.tags||[]).slice(); place.tags.splice(i,1); syncSheetFieldsIntoPlace(place); render(); };
  });
  document.querySelectorAll("[data-cover-del]").forEach(function(b){
    b.onclick = function(){ place.coverPhoto = null; syncSheetFieldsIntoPlace(place); render(); };
  });
  if((el=document.getElementById("cover-photo-add-btn"))) el.onclick = function(){ document.getElementById("cover-photo-file").click(); };
  if((el=document.getElementById("cover-photo-file"))){
    el.onchange = function(){
      var file = this.files && this.files[0]; if(!file) return;
      showToast("Adding photo…");
      fileToCompressedDataUrl(file, 640, 0.55).then(function(dataUrl){
        place.coverPhoto = dataUrl;
        syncSheetFieldsIntoPlace(place); render();
      }).catch(function(){ showToast("Couldn't add that photo"); });
    };
  }
  if((el=document.getElementById("add-review-btn"))){
    el.onclick = function(){ syncSheetFieldsIntoPlace(place); openReviewDraft(null); render(); };
  }
  document.querySelectorAll("[data-review-row]").forEach(function(row){
    row.onclick = function(e){
      if(e.target.closest("[data-review-edit]") || e.target.closest("[data-review-del]")) return;
      var id = row.getAttribute("data-review-row");
      var r = (place.reviews||[]).filter(function(x){return x.id===id;})[0];
      syncSheetFieldsIntoPlace(place);
      if(r) openReviewDraft(r, "view");
      render();
    };
  });
  document.querySelectorAll("[data-review-edit]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var id = b.getAttribute("data-review-edit");
      var r = (place.reviews||[]).filter(function(x){return x.id===id;})[0];
      syncSheetFieldsIntoPlace(place);
      if(r) openReviewDraft(r, "edit");
      render();
    };
  });
  document.querySelectorAll("[data-review-del]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      S.confirmDeleteReviewId = b.getAttribute("data-review-del");
      render();
    };
  });
  document.querySelectorAll("[data-review-del-cancel]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      S.confirmDeleteReviewId = null;
      render();
    };
  });
  document.querySelectorAll("[data-review-del-confirm]").forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var id = b.getAttribute("data-review-del-confirm");
      place.reviews = (place.reviews||[]).filter(function(x){return x.id!==id;});
      S.confirmDeleteReviewId = null;
      syncSheetFieldsIntoPlace(place);
      persistPlaceQuiet(place, "Review deleted");
    };
  });
  if(S.sheet.reviewDraft) bindReviewSheet(place);
  if((el=document.getElementById("del-start"))) el.onclick = function(){ S.confirmDeleteId = place.id; render(); };
  if((el=document.getElementById("del-cancel"))) el.onclick = function(){ S.confirmDeleteId = null; render(); };
  if((el=document.getElementById("del-confirm"))) el.onclick = function(){
    store.deletePlace(S.spaceCode, place.id).then(function(){
      showToast("Place deleted"); S.confirmDeleteId=null; S.sheet=null; S.shuffleResult=null; render();
    });
  };
  if((el=document.getElementById("sheet-save"))) el.onclick = function(){
    syncSheetFieldsIntoPlace(place);
    if(!place.name || !place.name.trim()){ showToast("Give it a name first"); return; }
    place.website = normalizeUrl(place.website);
    var data = Object.assign({}, place);
    var id = data.id; delete data.id; delete data.isNew;
    store.savePlace(S.spaceCode, id, data).then(function(){
      showToast("Saved"); S.sheet=null; S.confirmDeleteId=null; S.confirmDeleteReviewId=null; render();
    }).catch(function(){ showToast("Couldn't save — try again"); });
  };
}
function syncSheetFieldsIntoPlace(place){
  var el;
  if((el=document.getElementById("f-name"))) place.name = el.value;
  if((el=document.getElementById("f-neighborhood"))) place.neighborhood = el.value;
  if((el=document.getElementById("f-website"))) place.website = el.value;
  if((el=document.getElementById("f-source"))) place.source = el.value;
  if((el=document.getElementById("f-notes"))) place.notes = el.value;
  if(place.happyHour && place.happyHour.days){
    DAYS_OF_WEEK.forEach(function(d){
      var day = place.happyHour.days[d.key];
      var s, e;
      if((s=document.getElementById("hh-start-"+d.key))) day.start = s.value;
      if((e=document.getElementById("hh-end-"+d.key))) day.end = e.value;
    });
  }
}
function preserveSheetInput(){
  if(!S.sheet || !S.sheet.place) return;
  syncSheetFieldsIntoPlace(S.sheet.place);
  if(S.sheet.reviewDraft) syncReviewFieldsIntoDraft();
}
function closeSheet(){ S.sheet=null; S.confirmDeleteId=null; S.confirmDeleteReviewId=null; render(); }
function persistPlaceQuiet(place, successMsg){
  var data = Object.assign({}, place);
  var id = data.id; delete data.id; delete data.isNew;
  return store.savePlace(S.spaceCode, id, data).then(function(){
    place.isNew = false;
    if(successMsg) showToast(successMsg);
    render();
  }).catch(function(){ showToast("Couldn't save — try again"); render(); });
}

/* ---------------- Review sub-sheet ---------------- */
function openReviewDraft(existing, mode){
  if(existing){ S.sheet.reviewDraft = Object.assign({}, existing); S.sheet.reviewEditingId = existing.id; }
  else { S.sheet.reviewDraft = blankReview(); S.sheet.reviewEditingId = null; }
  S.sheet.originalReview = Object.assign({}, S.sheet.reviewDraft);
  S.sheet.reviewMode = mode || (existing ? "view" : "edit");
  S.sheet.reviewSetCover = false;
}
function closeReviewDraft(){ S.sheet.reviewDraft=null; S.sheet.reviewEditingId=null; S.sheet.reviewSetCover=false; render(); }
function syncReviewFieldsIntoDraft(){
  var r = S.sheet && S.sheet.reviewDraft; if(!r) return;
  var el;
  if((el=document.getElementById("rv-dishes"))) r.dishesLiked = el.value;
  if((el=document.getElementById("rv-comments"))) r.comments = el.value;
  if((el=document.getElementById("rv-date"))) r.date = el.value;
}
function bindReviewSheet(place){
  var el;
  var r = S.sheet.reviewDraft;
  var overlay = document.getElementById("review-overlay");
  if(overlay) overlay.onclick = function(e){ if(e.target===overlay) closeReviewDraft(); };
  if((el=document.getElementById("review-close"))) el.onclick = closeReviewDraft;
  if((el=document.getElementById("review-cancel"))) el.onclick = function(){
    if(!S.sheet.reviewEditingId){ closeReviewDraft(); return; }
    S.sheet.reviewDraft = Object.assign({}, S.sheet.originalReview);
    S.sheet.reviewMode = "view";
    render();
  };
  if((el=document.getElementById("review-edit-btn"))) el.onclick = function(){ S.sheet.reviewMode = "edit"; render(); };
  document.querySelectorAll("[data-review-for]").forEach(function(b){
    b.onclick = function(){ syncReviewFieldsIntoDraft(); r.uid = b.getAttribute("data-review-for"); render(); };
  });
  document.querySelectorAll("[data-review-star]").forEach(function(b){
    b.onclick = function(){
      var i = +b.getAttribute("data-review-star");
      var next = r.rating===i ? i-0.5 : (r.rating===i-0.5 ? 0 : i);
      syncReviewFieldsIntoDraft(); r.rating = next; render();
    };
  });
  document.querySelectorAll("[data-review-return]").forEach(function(b){
    b.onclick = function(){ syncReviewFieldsIntoDraft(); r.wouldReturn = b.getAttribute("data-review-return"); render(); };
  });
  if((el=document.getElementById("review-photo-add-btn"))) el.onclick = function(){ document.getElementById("review-photo-file").click(); };
  if((el=document.getElementById("review-photo-file"))){
    el.onchange = function(){
      var file = this.files && this.files[0]; if(!file) return;
      showToast("Adding photo…");
      fileToCompressedDataUrl(file, 640, 0.55).then(function(dataUrl){
        syncReviewFieldsIntoDraft(); r.photo = dataUrl; render();
      }).catch(function(){ showToast("Couldn't add that photo"); });
    };
  }
  document.querySelectorAll("[data-review-photo-del]").forEach(function(b){
    b.onclick = function(){ syncReviewFieldsIntoDraft(); r.photo = null; S.sheet.reviewSetCover=false; render(); };
  });
  if((el=document.getElementById("rv-set-cover"))){
    el.onchange = function(){ S.sheet.reviewSetCover = this.checked; };
  }
  if((el=document.getElementById("review-save"))){
    el.onclick = function(){
      syncReviewFieldsIntoDraft();
      var reviews = (place.reviews||[]).slice();
      var idx = reviews.findIndex(function(x){return x.id===r.id;});
      if(idx>-1) reviews[idx]=r; else reviews.push(r);
      place.reviews = reviews;
      if(place.status==="want") place.status = "been";
      if(S.sheet.reviewSetCover && r.photo) place.coverPhoto = r.photo;
      syncSheetFieldsIntoPlace(place);
      S.sheet.reviewDraft = null; S.sheet.reviewEditingId = null; S.sheet.reviewSetCover = false;
      persistPlaceQuiet(place, "Review saved");
    };
  }
}

/* ---------------- Boot ---------------- */
onAuthStateChanged(auth, function(user){
  S.authChecked = true; S.authBusy = false;
  if(!user){ S.authUser=null; S.meUid=null; S.me=null; render(); return; }
  S.authUser = user; S.meUid = user.uid;
  store.getUserProfile(user.uid).then(function(profile){
    if(profile && profile.displayName){
      S.me = profile.displayName; S.needsName = false;
      var last = loadLocalSpace();
      if(last && !S.spaceCode) enterSpace(last); else render();
    } else {
      S.needsName = true; render();
    }
  }).catch(function(){ S.needsName = true; render(); });
});

render();

setInterval(function(){
  if(S.sheet) return;
  var ae = document.activeElement;
  if(ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.tagName==="SELECT")) return;
  if(S.tab==="been" || S.tab==="want") render();
}, 60000);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
