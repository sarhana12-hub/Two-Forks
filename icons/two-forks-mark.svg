<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Two Forks mark — "Heart of Forks" (Concept E, final) -->
  <!-- Pasta cap: two noodle strands, one curling off each fork, with ridge ticks so it reads as rotini -->
  <g fill="none" stroke="#B9862C" stroke-width="6.5" stroke-linecap="round">
    <path d="M 12,30 C 18,7 27,2 34,9 C 40,15 45,19 48,18 C 51,17 50,23 45,24.5"/>
    <path d="M 88,30 C 82,7 73,2 66,9 C 60,15 55,19 52,18 C 49,17 50,23 55,24.5"/>
  </g>
  <g stroke="#73531B" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <line x1="14.5" y1="21" x2="18.5" y2="17.5"/>
    <line x1="19" y1="12.5" x2="23.5" y2="10.5"/>
    <line x1="27" y1="6.5" x2="31" y2="9"/>
    <line x1="35.5" y1="10.5" x2="38.5" y2="14.5"/>
    <line x1="42.5" y1="17" x2="46.5" y2="18.5"/>
    <line x1="85.5" y1="21" x2="81.5" y2="17.5"/>
    <line x1="81" y1="12.5" x2="76.5" y2="10.5"/>
    <line x1="73" y1="6.5" x2="69" y2="9"/>
    <line x1="64.5" y1="10.5" x2="61.5" y2="14.5"/>
    <line x1="57.5" y1="17" x2="53.5" y2="18.5"/>
  </g>
  <!-- Two forks at 60°, tines forming the heart's outer curve -->
  <g fill="#B23A26">
    <g transform="rotate(-30 50 92)">
      <rect x="47" y="56" width="6" height="36" rx="3"/>
      <path d="M 42,42 Q 42,38 46,38 L 54,38 Q 58,38 58,42 L 58,52 Q 58,58 50,58 Q 42,58 42,52 Z"/>
      <rect x="43" y="10" width="3.6" height="32" rx="1.8"/>
      <rect x="48.2" y="10" width="3.6" height="32" rx="1.8"/>
      <rect x="53.4" y="10" width="3.6" height="32" rx="1.8"/>
    </g>
    <g transform="rotate(30 50 92)">
      <rect x="47" y="56" width="6" height="36" rx="3"/>
      <path d="M 42,42 Q 42,38 46,38 L 54,38 Q 58,38 58,42 L 58,52 Q 58,58 50,58 Q 42,58 42,52 Z"/>
      <rect x="43" y="10" width="3.6" height="32" rx="1.8"/>
      <rect x="48.2" y="10" width="3.6" height="32" rx="1.8"/>
      <rect x="53.4" y="10" width="3.6" height="32" rx="1.8"/>
    </g>
  </g>
</svg>
